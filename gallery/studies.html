;\n    return (word >> 22u) ^ word;\n}\nfloat uintToUnit(uint h) { return float(h >> 8u) * (1.0 / 16777216.0); }\nvec2 uintToUnit(uvec2 h) { return vec2(h >> 8u) * (1.0 / 16777216.0); }\nvec3 uintToUnit(uvec3 h) { return vec3(h >> 8u) * (1.0 / 16777216.0); }\nvec4 uintToUnit(uvec4 h) { return vec4(h >> 8u) * (1.0 / 16777216.0); }\nfloat hash12(vec2 p) {\n    uvec2 q = uvec2(ivec2(floor(p)));\n    return uintToUnit(pcgHash(q.x + pcgHash(q.y)));\n}\n\n// ---- shader-skills library: noise ----\nvec2 quinticFade(vec2 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec3 quinticFade(vec3 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec2 quinticFadeDeriv(vec2 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec3 quinticFadeDeriv(vec3 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec3 valueNoiseD(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    vec2 u = quinticFade(f), du = quinticFadeDeriv(f);\n    float a = hash12(i);\n    float b = hash12(i + vec2(1.0, 0.0));\n    float c = hash12(i + vec2(0.0, 1.0));\n    float d = hash12(i + vec2(1.0, 1.0));\n    float k1 = b - a, k2 = c - a, k3 = a - b - c + d;\n    return vec3(a + k1 * u.x + k2 * u.y + k3 * u.x * u.y,\n                du * vec2(k1 + k3 * u.y, k2 + k3 * u.x));\n}\n\n// ---- shader-skills library: pattern ----\nfloat filteredStripes(float x, float w) {\n    w = max(w, 1e-4);\n    float a = x + 0.5 * w, b = x - 0.5 * w;\n    float ia = floor(a) * 0.5 + max(fract(a) - 0.5, 0.0);\n    float ib = floor(b) * 0.5 + max(fract(b) - 0.5, 0.0);\n    return (ia - ib) / w;\n}\n\n// ---- shader-skills library: color ----\nvec3 linearToSrgb(vec3 c) {\n    c = max(c, 0.0);\n    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));\n}\n\n// ---- shader ----\nconst float RADIUS=0.37;\nconst vec2 CENTER=vec2(-0.37,0.06);\n\nvec2 flow(vec2 p) {\n    float r2=max(dot(p,p),RADIUS*RADIUS);\n    float scale=RADIUS*RADIUS/(r2*r2);\n    return vec2(1.0,0.0)-scale*vec2(p.x*p.x-p.y*p.y,2.0*p.x*p.y);\n}\nvec2 direction(vec2 p) {\n    vec2 v=flow(p);\n    return v/max(length(v),0.0001);\n}\nfloat paperNoise(vec2 p,float frequency) {\n    return valueNoiseD(p*frequency).x;\n}\nfloat streaks(vec2 p,float px) {\n#if QUALITY == 1\n    const int TAPS=8;\n#else\n    const int TAPS=16;\n#endif\n    float h=0.095/float(TAPS), freq=min(170.0,0.45/px);\n    float total=paperNoise(p,freq), weights=1.0;\n    for(int signIndex=0;signIndex<2;signIndex++){\n        vec2 s=p;\n        float stepSize=signIndex==0?h:-h;\n        for(int j=1;j<=TAPS;j++){\n            vec2 mid=s+0.5*stepSize*direction(s);\n            s+=stepSize*direction(mid);\n            if(dot(s,s)<RADIUS*RADIUS) break;\n            float w=0.5+0.5*cos(PI*float(j)/float(TAPS+1));\n            total+=w*paperNoise(s,freq);\n            weights+=w;\n        }\n    }\n    return total/weights;\n}\nvoid mainImage(out vec4 fragColor,in vec2 fragCoord) {\n    vec2 p=rot2(-0.095)*((2.0*fragCoord-iResolution.xy)/iResolution.y-CENTER);\n    float px=2.0/iResolution.y, r2=max(dot(p,p),RADIUS*RADIUS);\n    float psi=p.y*(1.0-RADIUS*RADIUS/r2);\n    float potential=p.x*(1.0+RADIUS*RADIUS/r2);\n    vec2 v=flow(p);\n    vec3 paper=vec3(0.87,0.77,0.54), ink=vec3(0.018,0.092,0.11), vermilion=vec3(0.67,0.105,0.045);\n    vec3 col=paper;\n    float distanceToBody=length(p)-RADIUS;\n    if(distanceToBody>-px){\n        float lines=streaks(p,px);\n        float grain=smoothstep(0.42,0.61,lines);\n        float contour=filteredStripes(28.0*psi,28.0*px*max(length(v),0.01));\n        float tracer=0.5+0.5*cos(9.0*potential-1.9*iTime+4.0*psi);\n        float ribbon=1.0-smoothstep(0.018,0.050,abs(psi-0.065));\n        col=mix(paper,ink,clamp(0.80*grain+0.13*contour,0.0,1.0));\n        col=mix(col,vermilion,ribbon*(0.50+0.40*tracer));\n    }\n    float interior=1.0-smoothstep(-px,px,distanceToBody);\n    vec3 lacquer=mix(ink,vermilion,0.76+0.19*p.y/RADIUS);\n    col=mix(col,lacquer,interior);\n    col*=0.96+0.07*has vec3 ditherTPDF(vec2 fragCoord, int frame) {\n    vec2 r = hash22(vec2(floor(fragCoord) + 7919.0 * float(frame % 1024)));\n    return vec3((r.x + r.y - 1.0) / 255.0);\n}\n\n// ---- shader-skills library: debug ----\nvec3 debugNormal(vec3 n) { return 0.5 + 0.5 * n; }\nvec3 debugHeat(float t) {\n    t = clamp(t, 0.0, 1.0);\n    return clamp(vec3(1.5 * t, 1.6 * t * t * t - 0.1, 0.9 * sin(PI * t) + 0.2 * t * t), 0.0, 1.0);\n}\n\n// ---- shader ----\n// ---- art controls ----\nconst vec3  SUN_DIR = normalize(vec3(0.85, 0.2, -0.45));\nconst float SUN_INTENSITY = 20.0;\nconst float TERRAIN_SCALE = 0.32;    // horizontal frequency: smaller = broader mountains\nconst float TERRAIN_HEIGHT = 2.0;    // vertical scale in km\nconst float SNOW_LINE = 1.05;        // km\nconst float EXPOSURE = 1.4;\nconst float FOCAL = 1.8;\n\nfloat terrainHeight(vec2 xz) { return TERRAIN_HEIGHT * erodedFbm(xz * TERRAIN_SCALE, 9); }\n\nvec2 map(vec3 p) {\n    // p.y - h(xz) is not a distance on slopes. Scaling by 0.45 keeps the march safe for slopes up to about 63 degrees.\n    return vec2(0.45 * (p.y - terrainHeight(p.xz)), 1.0);\n}\n\n// Transmittance from a point at heightKm toward dir, through the atmosphere (colors the sunlight).\nvec3 sunTransmittance(float heightKm, vec3 dir) {\n    vec3 ro = vec3(0.0, ATMOSPHERE_GROUND_KM + heightKm, 0.0);\n    if (iSphere(ro, dir, vec3(0.0), ATMOSPHERE_GROUND_KM).x > 0.0) return vec3(0.0);\n    float tl = iSphere(ro, dir, vec3(0.0), ATMOSPHERE_TOP_KM).y;\n    vec3 depth = vec3(0.0);\n    for (int i = 0; i < 12; i++) {\n        vec3 q = ro + dir * ((float(i) + 0.5) * tl / 12.0);\n        depth += atmosphereExtinction(atmosphereDensity(length(q) - ATMOSPHERE_GROUND_KM)) * tl / 12.0;\n    }\n    return exp(-depth);\n}\n\nvec3 render(vec2 fragCoord) {\n    vec2 uv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;\n\n#if DEBUG_MODE == 1\n    return vec3(terrainHeight(uv * 8.0) / TERRAIN_HEIGHT * 0.5 + 0.3);\n#endif\n\n    vec3 ro = vec3(-3.0 + 0.2 * iTime,     return abs(p.x - centre);\n}\n\nfloat dampGround(vec2 p) {\n    return 1.0 - smoothstep(0.32, 0.32 + BANK_WIDTH, bankDistance(p));\n}\n\n// Accumulate nearby crowns at the shading point and at the ground plant's root.\n// Each crown stays within 1.6 units of its 2-unit founder cell.\nvoid stand(vec2 p, vec2 root, float px, out float rootCover, out float shade,\n           out vec3 crownColor, out float crownAlpha) {\n    vec2 cell = floor(p * 0.5);\n    rootCover = 0.0;\n    shade = 0.0;\n    crownColor = vec3(0.0);\n    crownAlpha = 0.0;\n    float top = -1.0;\n    for (int y = -1; y <= 1; y++) {\n        for (int x = -1; x <= 1; x++) {\n            vec2 id = cell + vec2(float(x), float(y));\n            vec3 seed = hash32(id);\n            vec2 founder = 2.0 * (id + 0.2 + 0.6 * seed.xy);\n            float wet = dampGround(founder);\n            float alder = step(seed.z, wet);\n            float suitability = max(wet, smoothstep(0.25, 0.75, valueNoise(founder * 0.26)));\n            if (hash12(id + 91.0) > suitability) continue;\n            for (int j = 0; j < 3; j++) {\n                vec3 r = hash33(vec3(id, float(j)));\n                vec2 centre = founder;\n                float radius = mix(0.44, 0.76, r.z);\n                if (j > 0) {\n                    float angle = TAU * r.x;\n                    centre += mix(0.40, 0.94, r.y) * vec2(cos(angle), sin(angle));\n                    radius *= 0.64;\n                }\n                if (bankDistance(centre) < 0.34 || distance(centre, vec2(-2.5, 0.0)) < CLEARING) continue;\n                vec2 q = (p - centre) / radius;\n                float d = length(q);\n                rootCover = max(rootCover, 1.0 - smoothstep(0.70, 1.42, distance(root, centre) / radius));\n                shade = max(shade, 1.0 - smoothstep(0.77, 1.12, length(q - vec2(0.27, -0.24))));\n                if (d > 1.18) continue;\n                float lobes = valueNoise(3.5 * q + 16.0 * r.xy);\n                float edge = d - (0.82 + 0.32 * lobes);\n                float alpha = 1.0 - smoothstep(-px / radius, px / radius, edge);\n                crownAlpha = max(crownAlpha, alpha);\n                float height = radius * (1.25 - d * d + 0.24 * lobes);\n                if (alpha > 0.0 && height > top) {\n                    top = height;\n                    float twigs = valueNoise(q * 8.0 + 24.0 * r.yz);\n                    vec3 leaves = mix(vec3(0.16, 0.25, 0.061), vec3(0.072, 0.22, 0.13), alder);\n                    float light = clamp(0.68 + dot(q, vec2(-0.34, 0.36)), 0.23, 1.0);\n                    crownColor = leaves * light * (0.40 + lobes + 0.42 * twigs) * (0.84 + 0.3 * r.z);\n                }\n            }\n        }\n    }\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n    float px = 8.0 / iResolution.y;\n    vec2 p = (fragCoord - 0.5 * iResolution.xy) * px;\n    vec2 id = floor(p * 3.0);\n    vec3 seed = hash32(id);\n    vec2 root = (id + 0.28 + 0.44 * seed.xy) / 3.0;\n    float cover, shade, alpha;\n    vec3 crown;\n    stand(p, root, px, cover, shade, crown, alpha);\n\n    float wet = dampGround(root);\n    float edge = 4.0 * cover * (1.0 - cover);\n    float fern = cover * wet;\n    float shrub = edge * (1.0 - 0.5 * wet);\n    float flowers = (1.0 - cover) * (1.0 - wet);\n    float grain = valueNoise(p * 3.0) + 0.45 * valueNoise(p * 13.0);\n    vec3 ground = mix(vec3(0.34, 0.32, 0.115), vec3(0.13, 0.21, 0.086), dampGround(p));\n    ground = mix(ground, vec3(0.13, 0.085, 0.042), shade * 0.85) * (0.67 + 0.46 * grain);\n\n    vec2 blade = rot2(seed.y * TAU) * (p - root);\n    float fernShape = min(length(blade * vec2(0.7, 2.0)), length(blade * vec2(2.0, 0.7)));\n    vec3 understory = vec3(0.0);\n    float plant = 0.0;\n    if (bankDistance(root) > 0.34) {\n        if (seed.z < fern) {\n            plant = 1.0 - smoothstep(0.040 - px, 0.040 + px, fernShape);\n            understory = vec3(0.18, 0.36, 0.09);\n        } else if (seed.z < fern + shrub) {\n            plant = 1.0 - smoothstep(0.072 - px, 0.072 + px, length(blade));\n            understory = vec3(0.085, 0.17, 0.047);\n        } else if (seed.z > 1.0 - 0.36 * flowers) {\n            plant = 1.0 - smoothstep(0.028 - px, 0.028 + px, length(blade));\n            understory = vec3(0.82, 0.66, 0.26);\n        }\n    }\n    float water = 1.0 - smoothstep(0.23, 0.31, bankDistance(p));\n    vec3 stream = vec3(0.043, 0.19, 0.20) * (0.8 + 0.3 * valueNoise(vec2(p.x * 19.0, p.y * 3.0 - iTime)));\n    vec3 col = mix(mix(ground, understory, plant), stream, water);\n    col = mix(col * (1.0 - 0.35 * shade), crown, alpha);\n#if DEBUG_MODE == 3\n    col = vec3(fern, shrub, flowers) * (1.0 - water);\n#elif DEBUG_MODE == 5\n    col = vec3(cover, wet, alpha);\n#endif\n    fragColor = vec4(linearToSrgb(col), 1.0);\n}\n","time":1.0,"modes":[0,3,5]},"room-radiosity":{"kind":"radiosity","image":"#define ROOM_RADIOSITY 1\n// A warm ceiling panel lights a plaster sphere in a blue and terracotta room.\n// @render time=2.0\n// @variant DEBUG_MODE=6\n#define DEBUG_MODE 0 // 6 direct, left and right bounce contributions\n\n// Library code below is bundled from shader-skills (MIT): https://github.com/gokayfem/shader-skills\n// ---- shader-skills library: common ----\nconst float PI  = 3.14159265358979;\nconst float TAU = 6.28318530717959;\n\n// ---- shader-skills library: hash ----\n// PCG-style 1D integer hash.\nuint pcgHash(uint v) {\n    uint state = v * 747796405u + 2891336453u;\n    uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;\n    return (word >> 22u) ^ word;\n}\n// 3D integer hash, three decorrelated outputs.\nuvec3 pcg3d(uvec3 v) {\n    v = v * 1664525u + 1013904223u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    v ^= v >> 16u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    return v;\n}\n// Map a uint to [0,1) using the top 24 bits, so the result can never round up to 1.0.\nfloat uintToUnit(uint h) { return float(h >> 8u) * (1.0 / 16777216.0); }\nvec2 uintToUnit(uvec2 h) { return vec2(h >> 8u) * (1.0 / 16777216.0); }\nvec3 uintToUnit(uvec3 h) { return vec3(h >> 8u) * (1.0 / 16777216.0); }\nvec4 uintToUnit(uvec4 h) { return vec4(h >> 8u) * (1.0 / 16777216.0); }\n// Random float in [0,1) for an integer-valued 2D input.\nfloat hash12(vec2 p) {\n    uvec2 q = uvec2(ivec2(floor(p)));\n    return uintToUnit(pcgHash(q.x + pcgHash(q.y)));\n}\n// Random vec3 in [0,1)^3 for an integer-valued 3D input.\nvec3 hash33(vec3 p) { return uintToUnit(pcg3d(uvec3(ivec3(floor(p))))); }\n\n// ---- shader-skills library: noise ----\n// Quintic fade 6t^5 - 15t^4 + 10t^3: C2-continuous interpolation weights for lattice noise.\nvec2 quinticFade(vec2 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec3 quinticFade(vec3 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\n// Derivative of quinticFade: 30 t^2 (t - 1)^2.\nvec2 quinticFadeDeriv(vec2 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec3 quinticFadeDeriv(vec3 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\n// Unit gradient for a 2D lattice point.\nvec2 latticeGradient(vec2 cell) {\n    float a = TAU * hash12(cell);\n    return vec2(cos(a), sin(a));\n}\n// 2D gradient (Perlin-style) noise with analytic derivatives. Returns vec3(value, d/dx, d/dy). Gradient noise has less grid-aligned blockiness than value noise. Prefer it for fBm.\nvec3 gradientNoiseD(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    vec2 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec2 ga = latticeGradient(i);\n    vec2 gb = latticeGradient(i + vec2(1.0, 0.0));\n    vec2 gc = latticeGradient(i + vec2(0.0, 1.0));\n    vec2 gd = latticeGradient(i + vec2(1.0, 1.0));\n    float va = dot(ga, f);\n    float vb = dot(gb, f - vec2(1.0, 0.0));\n    float vc = dot(gc, f - vec2(0.0, 1.0));\n    float vd = dot(gd, f - vec2(1.0, 1.0));\n    float k = va - vb - vc + vd;\n    float value = va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * k;\n    vec2 deriv = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.x * u.y * (ga - gb - gc + gd)\n               + du * (vec2(vb - va, vc - va) + u.yx * k);\n    return vec3(value, deriv);\n}\n// 2D gradient noise.\nfloat gradientNoise(vec2 p) { return gradientNoiseD(p).x; }\n// Dot product of a hashed 3D gradient with the offset to its lattice corner.\nfloat latticeGradDot(vec3 cell, vec3 corner, vec3 f) {\n    vec3 g = hash33(cell + corner) * 2.0 - 1.0;\n    return dot(g, f - corner);\n}\n// 3D gradient noise.\nfloat gradientNoise(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f);\n    return mix(mix(mix(latticeGradDot(i, vec3(0, 0, 0), f), latticeGradDot(i, vec3(1, 0, 0), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 0), f), latticeGradDot(i, vec3(1, 1, 0), f), u.x), u.y),\n               mix(mix(latticeGradDot(i, vec3(0, 0, 1), f), latticeGradDot(i, vec3(1, 0, 1), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 1), f), latticeGradDot(i, vec3(1, 1, 1), f), u.x), u.y), u.z);\n}\n// 3D gradient noise with analytic derivatives. Returns vec4(value, d/dx, d/dy, d/dz); value equals gradientNoise(p). The trilinear blend is expanded as a polynomial in the fade weights, so the gradient is the same blend of the corner gradients plus the chain-rule term of the fade.\nvec4 gradientNoiseD(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec3 g000 = hash33(i) * 2.0 - 1.0;\n    vec3 g100 = hash33(i + vec3(1, 0, 0)) * 2.0 - 1.0;\n    vec3 g010 = hash33(i + vec3(0, 1, 0)) * 2.0 - 1.0;\n    vec3 g110 = hash33(i + vec3(1, 1, 0)) * 2.0 - 1.0;\n    vec3 g001 = hash33(i + vec3(0, 0, 1)) * 2.0 - 1.0;\n    vec3 g101 = hash33(i + vec3(1, 0, 1)) * 2.0 - 1.0;\n    vec3 g011 = hash33(i + vec3(0, 1, 1)) * 2.0 - 1.0;\n    vec3 g111 = hash33(i + vec3(1, 1, 1)) * 2.0 - 1.0;\n    float v000 = dot(g000, f);\n    float v100 = dot(g100, f - vec3(1, 0, 0));\n    float v010 = dot(g010, f - vec3(0, 1, 0));\n    float v110 = dot(g110, f - vec3(1, 1, 0));\n    float v001 = dot(g001, f - vec3(0, 0, 1));\n    float v101 = dot(g101, f - vec3(1, 0, 1));\n    float v011 = dot(g011, f - vec3(0, 1, 1));\n    float v111 = dot(g111, f - vec3(1, 1, 1));\n    // value = v000 + kx u.x + ky u.y + kz u.z + kxy u.x u.y + kyz u.y u.z + kzx u.z u.x + kxyz u.x u.y u.z\n    float kx = v100 - v000, ky = v010 - v000, kz = v001 - v000;\n    float kxy = v000 - v100 - v010 + v110;\n    float kyz = v000 - v010 - v001 + v011;\n    float kzx = v000 - v100 - v001 + v101;\n    float kxyz = -v000 + v100 + v010 - v110 + v001 - v101 - v011 + v111;\n    float value = v000 + kx * u.x + ky * u.y + kz * u.z\n                + kxy * u.x * u.y + kyz * u.y * u.z + kzx * u.z * u.x + kxyz * u.x * u.y * u.z;\n    vec3 grad = g000 + (g100 - g000) * u.x + (g010 - g000) * u.y + (g001 - g000) * u.z\n              + (g000 - g100 - g010 + g110) * u.x * u.y\n              + (g000 - g010 - g001 + g011) * u.y * u.z\n              + (g000 - g100 - g001 + g101) * u.z * u.x\n              + (-g000 + g100 + g010 - g110 + g001 - g101 - g011 + g111) * u.x * u.y * u.z\n              + du * vec3(kx + kxy * u.y + kzx * u.z + kxyz * u.y * u.z,\n                          ky + kxy * u.x + kyz * u.z + kxyz * u.x * u.z,\n                          kz + kyz * u.y + kzx * u.x + kxyz * u.x * u.y);\n    return vec4(value, grad);\n}\n\n// ---- shader-skills library: intersect ----\n// Ray vs sphere centered at c with radius r. Returns vec2(tNear, tFar), or vec2(-1) on a miss. Uses the precision-friendly form that measures from the closest point on the ray.\nvec2 iSphere(vec3 ro, vec3 rd, vec3 c, float r) {\n    vec3 oc = ro - c;\n    float b = dot(oc, rd);\n    vec3 qc = oc - b * rd;\n    float h = r * r - dot(qc, qc);\n    if (h < 0.0) return vec2(-1.0);\n    h = sqrt(h);\n    return vec2(-b - h, -b + h);\n}\n\n// ---- shader-skills library: camera ----\n// Camera-to-world matrix looking from ro toward ta, with roll in radians. Columns are (right, up, forward).\nmat3 cameraMatrix(vec3 ro, vec3 ta, float roll) {\n    vec3 w = normalize(ta - ro);\n    vec3 up = vec3(sin(roll), cos(roll), 0.0);\n    vec3 u = normalize(cross(w, up));\n    vec3 v = cross(u, w);\n    return mat3(u, v, w);\n}\n// Primary ray direction for screen point uv. focal is about 1.5-2.5 for natural framing (see fovToFocal).\nvec3 cameraRay(mat3 cam, vec2 uv, float focal) {\n    return normalize(cam * vec3(uv, focal));\n}\n\n// ---- shader-skills library: shading ----\n// Approximate diffuse form factor from a small, oriented patch to a surface point. Both normals point out of their surfaces. Area is in squared world units. The finite area softens near-field error.\nfloat diffusePatchWeight(vec3 point, vec3 normal, vec3 center, vec3 patchNormal, float area) {\n    vec3 delta = center - point;\n    float distance2 = dot(delta, delta);\n    vec3 direction = delta * inversesqrt(max(distance2, 1e-10));\n    float coupling = max(dot(normal, direction), 0.0) * max(dot(patchNormal, -direction), 0.0);\n    return coupling * max(area, 0.0) / max(PI * distance2 + max(area, 0.0), 1e-10);\n}\n\n// ---- shader-skills library: color ----\n// Exact sRGB encode (OETF): linear -> display [0,1]. Apply exactly once, after tonemapping. pow(c, 1/2.2) is visibly wrong near black (0.001 encodes to 0.013 here vs 0.043 with 2.2).\nvec3 linearToSrgb(vec3 c) {\n    c = max(c, 0.0);\n    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));\n}\n\n// ---- shader-skills library: tonemap ----\n// AgX: log encoding plus a sigmoid inside an inset/outset gamut. Mid-grey 0.18 maps to about 0.5 display. Minimal implementation after Troy Sobotka's AgX and Benjamin Wrensch's polynomial fit (both MIT).\nvec3 tonemapAgX(vec3 c) {\n    const mat3 inset = mat3(0.842479062253094, 0.0423282422610123, 0.0423756549057051,\n                            0.0784335999999992, 0.878468636469772, 0.0784336,\n                            0.0792237451477643, 0.0791661274605434, 0.879142973793104);\n    const mat3 outset = mat3(1.19687900512017, -0.0528968517574562, -0.0529716355144438,\n                             -0.0980208811401368, 1.15190312990417, -0.0980434501171241,\n                             -0.0990297440797205, -0.0989611768448433, 1.15107367264116);\n    const float minEv = -12.47393, maxEv = 4.026069;\n    c = inset * max(c, 0.0);\n    c = clamp((log2(max(c, 1e-10)) - minEv) / (maxEv - minEv), 0.0, 1.0);\n    vec3 x2 = c * c, x4 = x2 * x2;\n    c = 15.5 * x4 * x2 - 40.14 * x4 * c + 31.96 * x4 - 6.868 * x2 * c + 0.4298 * x2 + 0.1191 * c - 0.00232;\n    c = outset * c;\n    return pow(max(c, 0.0), vec3(2.2));\n}\n\n// ---- shader ----\nconst float BOUNCE=1.0;\nconst float PANEL_X=0.15;\nconst vec3 ORB=vec3(-0.23,-0.39,-0.29);\nconst float RADIUS=0.60;\n\nbool clearSegment(vec3 a,vec3 b){\n    vec3 delta=b-a;\n    float t=clamp(dot(ORB-a,delta)/max(dot(delta,delta),1e-7),0.0,1.0);\n    return length(a+t*delta-ORB)>RADIUS-0.002;\n}\nvec3 panelLight(vec3 p,vec3 n){\n    vec3 sum=vec3(0.0);\n    for(int i=0;i<4;i++){\n        vec3 source=vec3(PANEL_X+0.25*(float(i%2)-0.5),1.29,-0.50+0.5*(float(i/2)-0.5));\n        if(clearSegment(p+0.003*n,source))\n            sum+=vec3(11.0,8.8,6.7)*diffusePatchWeight(p,n,source,vec3(0,-1,0),0.125);\n    }\n    return sum;\n}\nvec3 wallPigment(float side){\n    return side<0.0 ? vec3(0.82,0.135,0.044) : vec3(0.035,0.40,0.62);\n}\nvec3 wallBounce(vec3 p,vec3 n,float side){\n    vec3 sum=vec3(0.0);\n    vec3 inward=vec3(-side,0,0);\n    for(int j=0;j<3;j++) for(int i=0;i<3;i++){\n        vec3 surfacePoint=vec3(side*1.4,-1.0+(float(i)+0.5)*2.3/3.0,-1.6+(float(j)+0.5)*3.1/3.0);\n        if(clearSegment(p+0.003*n,surfacePoint))\n            sum+=panelLight(surfacePoint,inward)*diffusePatchWeight(p,n,surfacePoint,inward,2.3*3.1/9.0);\n    }\n    return wallPigment(side)*sum;\n}\n// Five inward-facing room surfaces, 4x4 diffuse patches per surface.\n// The sphere participates in visibility and receives bounced light.\nvoid roomPatch(ivec2 index,out vec3 p,out vec3 n,out vec3 albedo,out float area){\n    int face=index.x/4;\n    vec2 uv=(vec2(index.x%4,index.y)+0.5)/4.0;\n    vec3 v=vec3(mix(-1.4,1.4,uv.x),mix(-1.0,1.3,uv.y),mix(-1.6,1.5,uv.x));\n    if(face<2){\n        float side=face==0?-1.0:1.0;\n        p=vec3(1.4*side,v.y,v.z);n=vec3(-side,0,0);\n        albedo=wallPigment(side);area=2.3*3.1/16.0;\n    }else if(face<4){\n        float side=face==2?-1.0:1.0;\n        p=vec3(v.x,side<0.0?-1.0:1.3,mix(-1.6,1.5,uv.y));n=vec3(0,-side,0);\n        albedo=vec3(0.72);area=2.8*3.1/16.0;\n    }else{\n        p=vec3(v.x,v.y,-1.6);n=vec3(0,0,1);\n        albedo=vec3(0.73,0.70,0.64);area=2.8*2.3/16.0;\n    }\n}\nvec3 gatherRoom(vec3 p,vec3 n) {\n    vec3 incoming=vec3(0.0);\n    float totalWeight=0.0;\n    for(int y=0;y<4;y++) for(int x=0;x<20;x++){\n        ivec2 id=ivec2(x,y);\n        vec3 center,normal,albedo;float area;\n        roomPatch(id,center,normal,albedo,area);\n        float weight=diffusePatchWeight(p,n,center,normal,area);\n        if(weight>0.0 && clearSegment(p+0.003*n,center)){\n            incoming+=weight*texelFetch(iChannel0,id,0).rgb;\n            totalWeight+=weight;\n        }\n    }\n    return incoming/max(1.0,totalWeight);\n}\nvoid mainImage(out vec4 fragColor,in vec2 fragCoord){\n    vec2 uv=(2.0*fragCoord-iResolution.xy)/iResolution.y;\n    vec3 ro=vec3(0.05,0.08,2.72);\n    vec3 rd=cameraRay(cameraMatrix(ro,vec3(0,-0.12,-0.44),0.0),uv,1.55);\n    // The camera looks into a five-sided room. Find the nearest forward plane.\n    float t=(-1.6-ro.z)/rd.z;\n    vec3 n=vec3(0,0,1),base=vec3(0.73,0.70,0.64);\n    if(abs(rd.x)>1e-6){\n        float side=sign(rd.x), wall=(side*1.4-ro.x)/rd.x;\n        if(wall<t){ t=wall; n=vec3(-side,0,0); base=wallPigment(side); }\n    }\n    if(abs(rd.y)>1e-6){\n        float plane=rd.y<0.0 ? -1.0 : 1.3;\n        float wall=(plane-ro.y)/rd.y;\n        if(wall<t){ t=wall; n=vec3(0,-sign(rd.y),0); base=vec3(0.72); }\n    }\n    vec2 sphere=iSphere(ro,rd,ORB,RADIUS);\n    if(sphere.x>0.0 && sphere.x<t){\n        t=sphere.x;n=normalize(ro+t*rd-ORB);base=vec3(0.84,0.81,0.73);\n    }\n    vec3 p=ro+t*rd;\n    vec3 direct=panelLight(p,n);\n#ifdef ROOM_RADIOSITY\n    vec3 indirect=gatherRoom(p,n);\n#else\n    vec3 left=wallBounce(p,n,-1.0),right=wallBounce(p,n,1.0);\n    vec3 indirect=left+right;\n#endif\n    base*=0.97+0.035*gradientNoise(p*34.0);\n    vec3 col=base*(vec3(0.027)+direct+BOUNCE*indirect);\n    if(n.y < -0.99 && abs(p.x-PANEL_X)<0.25 && abs(p.z+0.5)<0.5) col=vec3(4.0,3.4,2.4);\n#if DEBUG_MODE == 6\n#ifdef ROOM_RADIOSITY\n    col=4.0*indirect;\n#else\n    col=vec3(length(direct)*0.35,length(left)*2.0,length(right)*2.0);\n#endif\n#endif\n    fragColor=vec4(linearToSrgb(tonemapAgX(col*1.7)),1.0);\n}\n","buffer":"// A warm ceiling panel lights a plaster sphere in a blue and terracotta room.\n// @render time=2.0\n// @variant DEBUG_MODE=6\n#define DEBUG_MODE 0 // 6 direct, left and right bounce contributions\n\n// Library code below is bundled from shader-skills (MIT): https://github.com/gokayfem/shader-skills\n// ---- shader-skills library: common ----\nconst float PI  = 3.14159265358979;\n\n// ---- shader-skills library: shading ----\n// Approximate diffuse form factor from a small, oriented patch to a surface point. Both normals point out of their surfaces. Area is in squared world units. The finite area softens near-field error.\nfloat diffusePatchWeight(vec3 point, vec3 normal, vec3 center, vec3 patchNormal, float area) {\n    vec3 delta = center - point;\n    float distance2 = dot(delta, delta);\n    vec3 direction = delta * inversesqrt(max(distance2, 1e-10));\n    float coupling = max(dot(normal, direction), 0.0) * max(dot(patchNormal, -direction), 0.0);\n    return coupling * max(area, 0.0) / max(PI * distance2 + max(area, 0.0), 1e-10);\n}\n\n// ---- shader ----\nconst float BOUNCE=1.0;\nconst float PANEL_X=0.15;\nconst vec3 ORB=vec3(-0.23,-0.39,-0.29);\nconst float RADIUS=0.60;\n\nbool clearSegment(vec3 a,vec3 b){\n    vec3 delta=b-a;\n    float t=clamp(dot(ORB-a,delta)/max(dot(delta,delta),1e-7),0.0,1.0);\n    return length(a+t*delta-ORB)>RADIUS-0.002;\n}\nvec3 panelLight(vec3 p,vec3 n){\n    vec3 sum=vec3(0.0);\n    for(int i=0;i<4;i++){\n        vec3 source=vec3(PANEL_X+0.25*(float(i%2)-0.5),1.29,-0.50+0.5*(float(i/2)-0.5));\n        if(clearSegment(p+0.003*n,source))\n            sum+=vec3(11.0,8.8,6.7)*diffusePatchWeight(p,n,source,vec3(0,-1,0),0.125);\n    }\n    return sum;\n}\nvec3 wallPigment(float side){\n    return side<0.0 ? vec3(0.82,0.135,0.044) : vec3(0.035,0.40,0.62);\n}\nvec3 wallBounce(vec3 p,vec3 n,float side){\n    vec3 sum=vec3(0.0);\n    vec3 inward=vec3(-side,0,0);\n    for(int j=0;j<3;j++) for(int i=0;i<3;i++){\n        vec3 surfacePoint=vec3(side*1.4,-1.0+(float(i)+0.5)*2.3/3.0,-1.6+(float(j)+0.5)*3.1/3.0);\n        if(clearSegment(p+0.003*n,surfacePoint))\n            sum+=panelLight(surfacePoint,inward)*diffusePatchWeight(p,n,surfacePoint,inward,2.3*3.1/9.0);\n    }\n    return wallPigment(side)*sum;\n}\n// Five inward-facing room surfaces, 4x4 diffuse patches per surface.\n// The sphere participates in visibility and receives bounced light.\nvoid roomPatch(ivec2 index,out vec3 p,out vec3 n,out vec3 albedo,out float area){\n    int face=index.x/4;\n    vec2 uv=(vec2(index.x%4,index.y)+0.5)/4.0;\n    vec3 v=vec3(mix(-1.4,1.4,uv.x),mix(-1.0,1.3,uv.y),mix(-1.6,1.5,uv.x));\n    if(face<2){\n        float side=face==0?-1.0:1.0;\n        p=vec3(1.4*side,v.y,v.z);n=vec3(-side,0,0);\n        albedo=wallPigment(side);area=2.3*3.1/16.0;\n    }else if(face<4){\n        float side=face==2?-1.0:1.0;\n        p=vec3(v.x,side<0.0?-1.0:1.3,mix(-1.6,1.5,uv.y));n=vec3(0,-side,0);\n        albedo=vec3(0.72);area=2.8*3.1/16.0;\n    }else{\n        p=vec3(v.x,v.y,-1.6);n=vec3(0,0,1);\n        albedo=vec3(0.73,0.70,0.64);area=2.8*2.3/16.0;\n    }\n}\nvec3 gatherRoom(vec3 p,vec3 n) {\n    vec3 incoming=vec3(0.0);\n    float totalWeight=0.0;\n    for(int y=0;y<4;y++) for(int x=0;x<20;x++){\n        ivec2 id=ivec2(x,y);\n        vec3 center,normal,albedo;float area;\n        roomPatch(id,center,normal,albedo,area);\n        float weight=diffusePatchWeight(p,n,center,normal,area);\n        if(weight>0.0 && clearSegment(p+0.003*n,center)){\n            incoming+=weight*texelFetch(iChannel0,id,0).rgb;\n            totalWeight+=weight;\n        }\n    }\n    return incoming/max(1.0,totalWeight);\n}\n// Initialize from the emitter, then apply one Jacobi radiosity iteration per feedback step.\nvoid mainImage(out vec4 fragColor,in vec2 fragCoord){\n    ivec2 id=ivec2(fragCoord);\n    fragColor=vec4(0,0,0,1);\n    if(id.x>=20 || id.y>=4) return;\n    vec3 p,n,albedo;float area;\n    roomPatch(id,p,n,albedo,area);\n    vec3 incoming=panelLight(p,n);\n    if(iFrame>0) incoming+=gatherRoom(p,n);\n    fragColor=vec4(albedo*incoming,1.0);\n}\n","modes":[0,6]},"alpine-cache":{"kind":"cache","image":"// Alpine valley: designed lowland corridor, multiscale ridges, snow accumulation, strata and aerial depth.\n// A heightfield cannot make overhangs. The controlled valley is not a drainage/erosion simulation.\n// @render time=0.0\n// @variant DEBUG_MODE=1\n// @variant DEBUG_MODE=2\n// @variant DEBUG_MODE=3\n// @variant DEBUG_MODE=4\n#define DEBUG_MODE 0 // 0 beauty | 1 elevation | 2 normal | 3 grass/rock/snow | 4 steps\n\n// Library code below is bundled from shader-skills (MIT): https://github.com/gokayfem/shader-skills\n// ---- shader-skills library: common ----\nconst float PI  = 3.14159265358979;\nconst float TAU = 6.28318530717959;\n\n// ---- shader-skills library: hash ----\n// PCG-style 1D integer hash.\nuint pcgHash(uint v) {\n    uint state = v * 747796405u + 2891336453u;\n    uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;\n    return (word >> 22u) ^ word;\n}\n// 3D integer hash, three decorrelated outputs.\nuvec3 pcg3d(uvec3 v) {\n    v = v * 1664525u + 1013904223u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    v ^= v >> 16u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    return v;\n}\n// Map a uint to [0,1) using the top 24 bits, so the result can never round up to 1.0.\nfloat uintToUnit(uint h) { return float(h >> 8u) * (1.0 / 16777216.0); }\nvec2 uintToUnit(uvec2 h) { return vec2(h >> 8u) * (1.0 / 16777216.0); }\nvec3 uintToUnit(uvec3 h) { return vec3(h >> 8u) * (1.0 / 16777216.0); }\nvec4 uintToUnit(uvec4 h) { return vec4(h >> 8u) * (1.0 / 16777216.0); }\n// Random float in [0,1) for an integer-valued 2D input.\nfloat hash12(vec2 p) {\n    uvec2 q = uvec2(ivec2(floor(p)));\n    return uintToUnit(pcgHash(q.x + pcgHash(q.y)));\n}\n// Random vec2 in [0,1)^2 for an integer-valued 2D input.\nvec2 hash22(vec2 p) {\n    ivec2 q = ivec2(floor(p));\n    return uintToUnit(pcg3d(uvec3(q.x, q.y, 0x2545u))).xy;\n}\n// Random vec3 in [0,1)^3 for an integer-valued 3D input.\nvec3 hash33(vec3 p) { return uintToUnit(pcg3d(uvec3(ivec3(floor(p))))); }\n\n// ---- shader-skills library: noise ----\n// Quintic fade 6t^5 - 15t^4 + 10t^3: C2-continuous interpolation weights for lattice noise.\nvec2 quinticFade(vec2 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec3 quinticFade(vec3 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\n// Derivative of quinticFade: 30 t^2 (t - 1)^2.\nvec2 quinticFadeDeriv(vec2 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec3 quinticFadeDeriv(vec3 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\n// Unit gradient for a 2D lattice point.\nvec2 latticeGradient(vec2 cell) {\n    float a = TAU * hash12(cell);\n    return vec2(cos(a), sin(a));\n}\n// 2D gradient (Perlin-style) noise with analytic derivatives. Returns vec3(value, d/dx, d/dy). Gradient noise has less grid-aligned blockiness than value noise. Prefer it for fBm.\nvec3 gradientNoiseD(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    vec2 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec2 ga = latticeGradient(i);\n    vec2 gb = latticeGradient(i + vec2(1.0, 0.0));\n    vec2 gc = latticeGradient(i + vec2(0.0, 1.0));\n    vec2 gd = latticeGradient(i + vec2(1.0, 1.0));\n    float va = dot(ga, f);\n    float vb = dot(gb, f - vec2(1.0, 0.0));\n    float vc = dot(gc, f - vec2(0.0, 1.0));\n    float vd = dot(gd, f - vec2(1.0, 1.0));\n    float k = va - vb - vc + vd;\n    float value = va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * k;\n    vec2 deriv = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.x * u.y * (ga - gb - gc + gd)\n               + du * (vec2(vb - va, vc - va) + u.yx * k);\n    return vec3(value, deriv);\n}\n// 2D gradient noise.\nfloat gradientNoise(vec2 p) { return gradientNoiseD(p).x; }\n// Dot product of a hashed 3D gradient with the offset to its lattice corner.\nfloat latticeGradDot(vec3 cell, vec3 corner, vec3 f) {\n    vec3 g = hash33(cell + corner) * 2.0 - 1.0;\n    return dot(g, f - corner);\n}\n// 3D gradient noise.\nfloat gradientNoise(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f);\n    return mix(mix(mix(latticeGradDot(i, vec3(0, 0, 0), f), latticeGradDot(i, vec3(1, 0, 0), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 0), f), latticeGradDot(i, vec3(1, 1, 0), f), u.x), u.y),\n               mix(mix(latticeGradDot(i, vec3(0, 0, 1), f), latticeGradDot(i, vec3(1, 0, 1), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 1), f), latticeGradDot(i, vec3(1, 1, 1), f), u.x), u.y), u.z);\n}\n// 3D gradient noise with analytic derivatives. Returns vec4(value, d/dx, d/dy, d/dz); value equals gradientNoise(p). The trilinear blend is expanded as a polynomial in the fade weights, so the gradient is the same blend of the corner gradients plus the chain-rule term of the fade.\nvec4 gradientNoiseD(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec3 g000 = hash33(i) * 2.0 - 1.0;\n    vec3 g100 = hash33(i + vec3(1, 0, 0)) * 2.0 - 1.0;\n    vec3 g010 = hash33(i + vec3(0, 1, 0)) * 2.0 - 1.0;\n    vec3 g110 = hash33(i + vec3(1, 1, 0)) * 2.0 - 1.0;\n    vec3 g001 = hash33(i + vec3(0, 0, 1)) * 2.0 - 1.0;\n    vec3 g101 = hash33(i + vec3(1, 0, 1)) * 2.0 - 1.0;\n    vec3 g011 = hash33(i + vec3(0, 1, 1)) * 2.0 - 1.0;\n    vec3 g111 = hash33(i + vec3(1, 1, 1)) * 2.0 - 1.0;\n    float v000 = dot(g000, f);\n    float v100 = dot(g100, f - vec3(1, 0, 0));\n    float v010 = dot(g010, f - vec3(0, 1, 0));\n    float v110 = dot(g110, f - vec3(1, 1, 0));\n    float v001 = dot(g001, f - vec3(0, 0, 1));\n    float v101 = dot(g101, f - vec3(1, 0, 1));\n    float v011 = dot(g011, f - vec3(0, 1, 1));\n    float v111 = dot(g111, f - vec3(1, 1, 1));\n    // value = v000 + kx u.x + ky u.y + kz u.z + kxy u.x u.y + kyz u.y u.z + kzx u.z u.x + kxyz u.x u.y u.z\n    float kx = v100 - v000, ky = v010 - v000, kz = v001 - v000;\n    float kxy = v000 - v100 - v010 + v110;\n    float kyz = v000 - v010 - v001 + v011;\n    float kzx = v000 - v100 - v001 + v101;\n    float kxyz = -v000 + v100 + v010 - v110 + v001 - v101 - v011 + v111;\n    float value = v000 + kx * u.x + ky * u.y + kz * u.z\n                + kxy * u.x * u.y + kyz * u.y * u.z + kzx * u.z * u.x + kxyz * u.x * u.y * u.z;\n    vec3 grad = g000 + (g100 - g000) * u.x + (g010 - g000) * u.y + (g001 - g000) * u.z\n              + (g000 - g100 - g010 + g110) * u.x * u.y\n              + (g000 - g010 - g001 + g011) * u.y * u.z\n              + (g000 - g100 - g001 + g101) * u.z * u.x\n              + (-g000 + g100 + g010 - g110 + g001 - g101 - g011 + g111) * u.x * u.y * u.z\n              + du * vec3(kx + kxy * u.y + kzx * u.z + kxyz * u.y * u.z,\n                          ky + kxy * u.x + kyz * u.z + kxyz * u.x * u.z,\n                          kz + kyz * u.y + kzx * u.x + kxyz * u.x * u.y);\n    return vec4(value, grad);\n}\nconst int FBM_MAX_OCTAVES = 12;\n// Fractional Brownian motion over 2D gradient noise. Each octave is rotated to hide lattice alignment. persistence 0.5 is the classic look (H = 1). Lower is smoother, higher is rougher.\nfloat fbm(vec2 p, int octaves, float lacunarity, float persistence) {\n    const mat2 octaveRotation = mat2(0.8, 0.6, -0.6, 0.8);\n    float sum = 0.0, amp = 1.0, norm = 0.0;\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        sum += amp * gradientNoise(p);\n        norm += amp;\n        amp *= persistence;\n        p = lacunarity * (octaveRotation * p) + vec2(17.13, -3.71);\n    }\n    return 1.4 * sum / norm;\n}\n// 2D fBm with the usual defaults (lacunarity 2.01 so octave peaks never re-align, persistence 0.5).\nfloat fbm(vec2 p, int octaves) { return fbm(p, octaves, 2.01, 0.5); }\n// fBm over 3D gradient noise.\nfloat fbm(vec3 p, int octaves, float lacunarity, float persistence) {\n    const mat3 octaveRotation = mat3(0.00, 0.80, 0.60,\n                                     -0.80, 0.36, -0.48,\n                                     -0.60, -0.48, 0.64);\n    float sum = 0.0, amp = 1.0, norm = 0.0;\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        sum += amp * gradientNoise(p);\n        norm += amp;\n        amp *= persistence;\n        p = lacunarity * (octaveRotation * p) + vec3(17.13, -3.71, 5.29);\n    }\n    return sum / norm;\n}\n// Terrain fBm where each octave is damped by the accumulated slope, so detail settles in valleys and steep slopes stay smooth. This gives an eroded look without simulation.\nfloat erodedFbm(vec2 p, int octaves) {\n    const mat2 octaveRotation = mat2(0.8, 0.6, -0.6, 0.8);\n    float h = 0.0, amp = 0.5;\n    vec2 slope = vec2(0.0);\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        vec3 n = gradientNoiseD(p);\n        slope += n.yz;\n        h += amp * n.x / (1.0 + dot(slope, slope));\n        amp *= 0.5;\n        p = 2.0 * (octaveRotation * p);\n    }\n    return 2.0 * h;\n}\n// Ridged multifractal: inverted |noise| creates sharp crests; each octave is weighted by the previous one, so detail gathers along ridges.\nfloat ridgedFbm(vec2 p, int octaves) {\n    const mat2 octaveRotation = mat2(0.8, 0.6, -0.6, 0.8);\n    float sum = 0.0, amp = 0.5, weight = 1.0, norm = 0.0;\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        float n = 1.0 - abs(gradientNoise(p) * 1.4);\n        n *= n;\n        sum += amp * n * weight;\n        norm += amp;\n        weight = clamp(n * 2.0, 0.0, 1.0);\n        amp *= 0.5;\n        p = 2.01 * (octaveRotation * p) + vec2(17.13, -3.71);\n    }\n    return sum / norm;\n}\n\n// ---- shader-skills library: raymarch ----\n#define ZERO (min(iFrame, 0))\nvec2 map(vec3 p);\n// Surface normal from 4 tetrahedral samples (cheaper than 6 central differences, and still centered). eps should scale with distance, e.g. 0.0005 * t: that filters distant detail and avoids sparkling.\nvec3 calcNormal(vec3 p, float eps) {\n    vec3 n = vec3(0.0);\n    for (int i = ZERO; i < 4; i++) {\n        vec3 e = 0.5773 * (2.0 * vec3((((i + 3) >> 1) & 1), ((i >> 1) & 1), (i & 1)) - 1.0);\n        n += e * map(p + e * eps).x;\n    }\n    return normalize(n);\n}\n// Soft shadow toward a light along unit rd. k controls sharpness (k is about 1 / light angular size: 8 soft, 32 hard). Uses the \"closest approach between samples\" estimate, which removes banding from sharp-cornered occluders. Returns 0 (full shadow) .. 1 (lit).\nfloat softShadow(vec3 ro, vec3 rd, float tmin, float tmax, float k) {\n    float res = 1.0;\n    float t = tmin;\n    float ph = 1e10;\n    for (int i = ZERO; i < 64; i++) {\n        float h = map(ro + rd * t).x;\n        if (h < 0.0001) return 0.0;\n        float y = h * h / (2.0 * ph);\n        float d = sqrt(max(h * h - y * y, 0.0));\n        res = min(res, k * d / max(t - y, 1e-4));\n        ph = h;\n        t += clamp(h, 0.005, 0.5);\n        if (res < 0.001 || t > tmax) break;\n    }\n    re alpha = max(roughness, 0.045);\n    alpha *= alpha;\n    return PI * distributionGGX(NoH, alpha) * visibilitySmithGGX(NoV, NoL, alpha) * fresnelSchlick(VoH, f0) * NoL;\n}\n// Complete metallic-roughness shading for one light (diffuse + specular, NoL included, artist units). Multiply by light color and shadow. Keep albedo around 0.05-0.7 (linear); brighten lights, not albedo.\nvec3 shadePBR(vec3 n, vec3 v, vec3 l, vec3 albedo, float roughness, float metallic) {\n    vec3 f0 = mix(vec3(0.04), albedo, metallic);\n    float NoL = clamp(dot(n, l), 0.0, 1.0);\n    vec3 F = fresnelSchlick(max(dot(n, v), 0.0), f0);\n    vec3 diffuse = albedo * (1.0 - metallic) * (1.0 - F) * NoL;\n    return diffuse + specularGGX(n, v, l, roughness, f0);\n}\n// Hemisphere light: sky color from above blended to ground color from below.\nvec3 hemisphereLight(vec3 n, vec3 skyColor, vec3 groundColor) {\n    return mix(groundColor, skyColor, 0.5 + 0.5 * n.y);\n}\n\n// ---- shader-skills library: color ----\n// Exact sRGB encode (OETF): linear -> display [0,1]. Apply exactly once, after tonemapping. pow(c, 1/2.2) is visibly wrong near black (0.001 encodes to 0.013 here vs 0.043 with 2.2).\nvec3 linearToSrgb(vec3 c) {\n    c = max(c, 0.0);\n    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));\n}\n\n// ---- shader-skills library: tonemap ----\n// AgX: log encoding plus a sigmoid inside an inset/outset gamut. Mid-grey 0.18 maps to about 0.5 display. Minimal implementation after Troy Sobotka's AgX and Benjamin Wrensch's polynomial fit (both MIT).\nvec3 tonemapAgX(vec3 c) {\n    const mat3 inset = mat3(0.842479062253094, 0.0423282422610123, 0.0423756549057051,\n                            0.0784335999999992, 0.878468636469772, 0.0784336,\n                            0.0792237451477643, 0.0791661274605434, 0.879142973793104);\n    const mat3 outset = mat3(1.19687900512017, -0.0528968517574562, -0.0529716355144438,\n                             -0.0980208811401368, 1.15 symptotic\n// slowdown of a small globally scaled gap near the horizon; crossings are refined by bisection.\nvec3 traceAlpine(vec3 ro,vec3 rd) {\n    float t=0.02,previous=0.0;\n    for(int i=0;i<ALPINE_TRACE_STEPS;i++) {\n        vec3 p=ro+rd*t;\n        if (rd.y >= 0.0 && p.y > 23.31) break;\n        if (p.y <= alpineCeiling(p.x) && p.y < alpineHeight(p.xz)) {\n            float lo=previous,hi=t;\n            for(int j=0;j<10;j++) {\n                float mid=0.5*(lo+hi);\n                vec3 q=ro+rd*mid;\n                if(q.y>alpineHeight(q.xz))lo=mid;else hi=mid;\n            }\n            return vec3(0.5*(lo+hi),1.0,float(i));\n        }\n        previous=t;\n        t+=0.04+0.015*t;\n        if(t>FAR_DISTANCE)break;\n    }\n    return vec3(-1.0,0.0,float(ALPINE_TRACE_STEPS));\n}\n\nvec3 alpineSky(vec3 rd) {\n    vec3 c=simpleSky(rd,ALPINE_SUN);\n    // A broad cloud mask in sky-direction space; it is not a cloud volume.\n    float cloud=smoothstep(0.1,0.5,fbm(rd.xz/max(rd.y+0.45,0.15)*1.2,4));\n    return mix(c,vec3(0.86,0.88,0.91),cloud*0.45*smoothstep(0.05,0.4,rd.y));\n}\n\nvec3 alpineRender(vec2 coord) {\n    vec2 uv=(2.0*coord-iResolution.xy)/iResolution.y;\n    vec3 ro=vec3(0.15,2.1,10.0-0.25*iTime);\n    ro.y=max(ro.y,alpineHeight(ro.xz)+0.7);\n    vec3 rd=cameraRay(cameraMatrix(ro,vec3(0.0,1.9,-15.0),0.0),uv,1.8);\n    vec3 hit=traceAlpine(ro,rd);\n#if DEBUG_MODE == 4\n    return debugHeat(hit.z/float(ALPINE_TRACE_STEPS));\n#endif\n    if(hit.x<0.0)return alpineSky(rd);\n    vec3 p=ro+rd*hit.x;\n    float footprint=hit.x*2.0/(iResolution.y*1.8);\n    vec3 n=calcNormal(p,max(0.002,footprint*0.5));\n    float snow=smoothstep(SNOW_ALTITUDE-0.3,SNOW_ALTITUDE+0.4,p.y+0.22*fbm(p.xz*2.0,3))\n              *smoothstep(0.35,0.75,n.y);\n    float grass=smoothstep(0.6,0.9,n.y)*(1.0-smoothstep(1.4,2.5,p.y));\n    float detailKeep=1.0-smoothstep(0.02,0.2,footprint);\n    float grain=0.5+0.5*fbm(p.xz*18.0,3)*detailKeep;\n    float strata=0.5+0.5*sin(p.y*35.0+fbm(p.xz*3.0,3)*2.0);\n    vec3 rock=mix(vec3(0.16,0.15,0.14),vec3(0.32,0.29,0.25),grain)*(0.85+0.15*strata*detailKeep);\n    vec3 albedo=mix(rock,mix(vec3(0.075,0.12,0.035),vec3(0.16,0.20,0.065),grain),grass);\n    albedo=mix(albedo,vec3(0.78,0.84,0.9),snow);\n    float shadow=softShadow(p+n*0.03,ALPINE_SUN,0.03,15.0,12.0);\n    vec3 col=shadePBR(n,-rd,ALPINE_SUN,albedo,0.8,0.0)*vec3(3.4,3.0,2.5)*shadow;\n    col+=albedo*hemisphereLight(n,vec3(0.4,0.58,0.85),vec3(0.16,0.13,0.095));\n#if DEBUG_MODE == 1\n    return vec3(p.y/6.0);\n#elif DEBUG_MODE == 2\n    return n*0.5+0.5;\n#elif DEBUG_MODE == 3\n    return vec3(grass,1.0-grass,snow);\n#endif\n    vec3 haze=alpineSky(normalize(vec3(rd.x,0.04,rd.z)));\n    float fog=heightFog(ro,rd,hit.x,0.011,0.18);\n    return mix(col,haze,fog);\n}\n\nvoid mainImage(out vec4 fragColor,in vec2 fragCoord) {\n    vec3 col=alpineRender(fragCoord);\n#if DEBUG_MODE == 0\n    col=linearToSrgb(tonemapAgX(col*1.15))+ditherTPDF(fragCoord,iFrame);\n#endif\n    fragColor=vec4(col,1.0);\n}\n","buffer":"\n\n// Library code below is bundled from shader-skills (MIT): https://github.com/gokayfem/shader-skills\n// ---- shader-skills library: common ----\nconst float TAU = 6.28318530717959;\n\n// ---- shader-skills library: hash ----\n// PCG-style 1D integer hash.\nuint pcgHash(uint v) {\n    uint state = v * 747796405u + 2891336453u;\n    uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;\n    return (word >> 22u) ^ word;\n}\n// 3D integer hash, three decorrelated outputs.\nuvec3 pcg3d(uvec3 v) {\n    v = v * 1664525u + 1013904223u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    v ^= v >> 16u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    return v;\n}\n// Map a uint to [0,1) using the top 24 bits, so the result can never round up to 1.0.\nfloat uintToUnit(uint h) { return float(h >> 8u) * (1.0 / 16777216.0); }\nvec2 uintToUnit(uvec2 h) { return vec2(h >> 8u) * (1.0 / 16777216.0); n    float v101 = dot(g101, f - vec3(1, 0, 1));\n    float v011 = dot(g011, f - vec3(0, 1, 1));\n    float v111 = dot(g111, f - vec3(1, 1, 1));\n    // value = v000 + kx u.x + ky u.y + kz u.z + kxy u.x u.y + kyz u.y u.z + kzx u.z u.x + kxyz u.x u.y u.z\n    float kx = v100 - v000, ky = v010 - v000, kz = v001 - v000;\n    float kxy = v000 - v100 - v010 + v110;\n    float kyz = v000 - v010 - v001 + v011;\n    float kzx = v000 - v100 - v001 + v101;\n    float kxyz = -v000 + v100 + v010 - v110 + v001 - v101 - v011 + v111;\n    float value = v000 + kx * u.x + ky * u.y + kz * u.z\n                + kxy * u.x * u.y + kyz * u.y * u.z + kzx * u.z * u.x + kxyz * u.x * u.y * u.z;\n    vec3 grad = g000 + (g100 - g000) * u.x + (g010 - g000) * u.y + (g001 - g000) * u.z\n              + (g000 - g100 - g010 + g110) * u.x * u.y\n              + (g000 - g010 - g001 + g011) * u.y * u.z\n              + (g000 - g100 - g001 + g101) * u.z * u.x\n              + (-g000 + g100 + g010 - g110 + g001 - g101 - g011 + g111) * u.x * u.y * u.z\n              + du * vec3(kx + kxy * u.y + kzx * u.z + kxyz * u.y * u.z,\n                          ky + kxy * u.x + kyz * u.z + kxyz * u.x * u.z,\n                          kz + kyz * u.y + kzx * u.x + kxyz * u.x * u.y);\n    return vec4(value, grad);\n}\nconst int FBM_MAX_OCTAVES = 12;\n// Fractional Brownian motion over 2D gradient noise. Each octave is rotated to hide lattice alignment. persistence 0.5 is the classic look (H = 1). Lower is smoother, higher is rougher.\nfloat fbm(vec2 p, int octaves, float lacunarity, float persistence) {\n    const mat2 octaveRotation = mat2(0.8, 0.6, -0.6, 0.8);\n    float sum = 0.0, amp = 1.0, norm = 0.0;\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        sum += amp * gradientNoise(p);\n        norm += amp;\n        amp *= persistence;\n        p = lacunarity * (octaveRotation * p) + vec2(17.13, -3.71);\n    }\n    return 1.4 * sum / norm;\n}\n// 2D fBm with the usual defaults         fastWindows=0;
        recoveryWindows=Math.min(8,recoveryWindows*2);
    } else if (median<fast && level<adaptiveWidths.length-1) {
        if (++fastWindows>=recoveryWindows) {
            resizeOutput(adaptiveWidths[level+1]);
            fastWindows=0;
        }
    } else {
        fastWindows=0;
    }
    element('scale').value=canvas.width+' × '+canvas.height;
}

// name, label, minimum, maximum, default, increment. Turn just these named constants into live uniforms.
const knobs={
    'room-radiosity':[['PANEL_X','Lamp position',-0.7,0.7,0.15,0.025],['BOUNCE','Indirect contribution',0,3,1,0.05]],
    'kelp-passage':[['CURRENT','Current strength',0,1.5,0.7,0.05],['SHAFTS','Sun shafts',0,2,0.8,0.05]],
    'sponge-shelf':[['LANTERN','Rim fluorescence',0,3,1.2,0.05]],
    'ribbed-wreck':[['CAMERA_ARC','Orbit angle',0,6.28,0.63,0.02],['DIVE_DEPTH','Dive depth',0,1,0.45,0.02],['MURK','Water attenuation',0.03,0.6,0.16,0.01]],
    'pigment-chamber':[['BOUNCE','Wall bounce',0,3,1,0.05],['PANEL_X','Lamp position',-0.7,0.7,0.15,0.025]],
    'tide-observatory':[['HOUR','Solar hour',0,24,19.7,0.1],['OVERCAST','Cloud cover',0,1,0.32,0.01],['MOON_PHASE','Lunar phase',0,1,0.18,0.01]],
    'woodland-edge':[['CLEARING','Clearing radius',0,3.5,0.7,0.1],['BANK_WIDTH','Wet bank width',0.2,3,1.5,0.1]],
    'cloudline-forest':[['ERROR_PX','Branch error (px)',0.2,8,1.5,0.1],['WIND','Wind strength',0,1.8,0.55,0.05]],
    'lensed-disk':[['INCLINATION','Disk elevation',0.025,0.8,0.17,0.005],['EXPOSURE','Exposure',0.2,3,1.3,0.05]],
    'morpho':[['LAYER_PERIOD_NM','Layer period (nm)',145,184,172,1],['WING_BEAT','Wingbeat rate',0,2,0.62,0.02]],
    'comb-jelly':[['KEY_LIGHT','Side light',0,2,1,0.02],['BEAT_SPEED','Comb beat',0,6,2.6,0.1]],
    'streamline-press':[['RADIUS','Cylinder radius',0.18,0.7,0.37,0.01]],
    'reaction-diffusion':[['FEED','Feed',0.018,0.060,0.035,0.001],['KILL','Removal',0.045,0.070,0.061,0.001]]
};
const diagnosticNames={
    'room-radiosity':{6:'Indirect radiance'},
    'kelp-passage':{3:'Kelp / wildlife / shafts'}, 'sponge-shelf':{2:'Surface normals'},
    'ribbed-wreck':{4:'Trace cost'}, 'pigment-chamber':{6:'Direct / left / right bounce'},
    'tide-observatory':{3:'Clouds / moon / coast'}, 'cloudline-forest':{4:'Branch refinement'},
    'woodland-edge':{3:'Fern / edge shrub / meadow flowers',5:'Root cover / moisture / crown silhouette'},
    'morpho':{3:'Scale return / pigment / veins'},
    'comb-jelly':{3:'Front / rear / thickness'},
    'lensed-disk':{3:'Direct / secondary disk'},
    'streamline-press':{2:'Flow direction and speed'},
    'reaction-diffusion':{3:'Concentrations U and V'}
};
let parameters={};
const useTransfer=()=>scene?.kind==='transfer' && element('reuse').checked;
function refreshTransfer(){
    if(useTransfer()) draw(buffer,targets[0],null,0);
}
function displaySource(){
    const src=useTransfer()?scene.cachedImage:scene.image;
    return src.replace(/(#define\s+DEBUG_MODE\s+)\d+/,(_,prefix)=>prefix+modes.value);
}
function controls(){
    parameters={};
    const holder=element('controls');holder.replaceChildren();
    for(const [name,desc,min,max,initial,step] of knobs[menu.value]||[]){
        const label=document.createElement('label'), slider=document.createElement('input'), value=document.createElement('output');
        slider.type='range'; Object.assign(slider,{min,max,step,value:initial});
        value.value=String(initial);parameters[name]=initial;
        slider.oninput=()=>{parameters[name]=Number(slider.value);value.value=slider.value;if(name==="INCLINATION")refreshTransfer();if(name==="PANEL_X" && scene.kind==="radiosity")solveRoom();show();};
        label.append(desc,slider,value);holder.append(label);
    }
    holder.hidden=!holder.childElementCount;
}

function compile(type, code) {
    const shader=gl.createShader(type);
    gl.shaderSource(shader,code); gl.compileShader(shader);
    if (!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) {
        const message=gl.getShaderInfoLog(shader); gl.deleteShader(shader); throw Error(message);
    }
    return shader;
}
function link(source,preserveAlpha=false) {
    for(const name of Object.keys(parameters)) {
        const declaration=new RegExp('const\\s+float\\s+'+name+'\\s*=\\s*[0-9.]+\\s*;');
        source=source.replace(declaration,'uniform float '+name+';');
    }
    const p=gl.createProgram(), fs=compile(gl.FRAGMENT_SHADER,DATA.prelude+source+(preserveAlpha?"\nvoid main(){mainImage(st_FragColor,gl_FragCoord.xy);}":DATA.main));
    gl.attachShader(p,vs); gl.attachShader(p,fs); gl.linkProgram(p); gl.deleteShader(fs);
    if (!gl.getProgramParameter(p,gl.LINK_STATUS)) {
        const message=gl.getProgramInfoLog(p); gl.deleteProgram(p); throw Error(message);
    }
    const loc = name=>gl.getUniformLocation(p,name);
    return {p,knobs:Object.keys(parameters).map(k=>[k,loc(k)]),res:loc('iResolution'),frame:loc('iFrame'),time:loc('iTime'),mouse:loc('iMouse')};
}
function target(w,h,fullPrecision=false) {
    const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texStorage2D(gl.TEXTURE_2D,1,fullPrecision?gl.RGBA32F:gl.RGBA16F,w,h);
    for (const k of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D,k,fullPrecision?gl.NEAREST:gl.LINEAR);
    for (const k of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE);
    const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE) throw Error('Floating-point framebuffer unavailable.');
    return {tex,fb,w,h};
}
function draw(shader,destination,texture,index) {
    const w=destination?.w??canvas.width, h=destination?.h??canvas.height;
    gl.bindFramebuffer(gl.FRAMEBUFFER,destination?.fb??null); gl.bindTexture(gl.TEXTURE_2D,texture);
    gl.viewport(0,0,w,h); gl.useProgram(shader.p);
    for(const [name,location] of shader.knobs) gl.uniform1f(location,parameters[name]);
    gl.uniform3f(shader.res,w,h,1); gl.uniform1f(shader.time,time); gl.uniform1i(shader.frame,index);
    gl.uniform4f(shader.mouse,mouse[0]*w,mouse[1]*h,mouse[2]*w,mouse[3]*h);
    gl.drawArrays(gl.TRIANGLES,0,3);
}
function show() {
    draw(image,null,targets.length?targets[0].tex:null,frame);
    element('clock').value=scene.kind==='simulation' ? 'Step '+frame : time.toFixed(1)+' s';
}
function advanceSimulation(steps) {
    for(let i=0;i<steps;i++) {
        draw(buffer,targets[1],targets[0].tex,frame++);
        targets.reverse();
    }
}
function solveRoom() {
    for(let bounce=0;bounce<4;bounce++){
        draw(buffer,targets[1],targets[0].tex,bounce);
        targets.reverse();
    }
}
function reset() {
    time=scene.time??0; frame=0; previous=0;
    if(scene.kind==='simulation') {
        advanceSimulation(1);
    }
    show();
}
function load() {
    cancelAnimationFrame(nextFrame);
    if (image) gl.deleteProgram(image.p);
    if (buffer) gl.deleteProgram(buffer.p);
    for(const t of targets){gl.deleteTexture(t.tex);gl.deleteFramebuffer(t.fb);}
    image=null; buffer=null; targets=[];
    resetCadence();
    scene=DATA.scenes[menu.value];
    modes.replaceChildren(...scene.modes.map(n=>new Option(n===0?'Final':(diagnosticNames[menu.value]?.[n]??'Debug '+n),n)));
    element('modeLabel').hidden=scene.modes.length<2;
    element('step').hidden=playing;
    element('error').textContent='';
    element('hint').textContent=scene.kind==='simulation'?'Drag across the image to seed the reaction.':
        scene.kind==='cache'?'Terrain height is baked once into a 1536 × 1536 texture.':'';
    element('reuseLabel').hidden=scene.kind!=='transfer';
    if(scene.kind==='transfer' && !gl.getExtension('EXT_color_buffer_float')){
        element('reuse').checked=false;element('reuse').disabled=true;
    }
    controls(); image=link(displaySource());
    if(scene.buffer && (scene.kind!=='transfer' || !element('reuse').disabled)){
        if(!gl.getExtension('EXT_color_buffer_float')) throw Error('This study requires floating-point render targets.');
        buffer=link(scene.buffer,scene.kind==='transfer');
        if(scene.kind==='transfer') {
            targets.push(target(canvas.width,canvas.height,true));refreshTransfer();
        } else if(scene.kind==='radiosity'){
            targets.push(target(20,4),target(20,4));
            solveRoom();
        } else {
            targets.push(target(scene.kind==='cache'?1536:320,scene.kind==='cache'?1536:180));
            if(scene.kind==='simulation') targets.push(target(320,180));
            else draw(buffer,targets[0],null,0);
        }
    }
    mouse=[0,0,0,0]; reset(); nextFrame=requestAnimationFrame(tick);
}
function tick(now) {
    if(playing){
        if(previous) trackCadence(now-previous);
        time+=previous?Math.min((now-previous)/1000,0.1):0;
        if(scene.kind==='simulation') advanceSimulation(5); else frame++;
        show();
    }
    previous=now; nextFrame=requestAnimationFrame(tick);
}
function attempt(fn){try{fn();}catch(err){element('error').textContent=String(err);}}
menu.onchange=()=>attempt(()=>{location.hash=menu.value;load();});
modes.onchange=()=>attempt(()=>{
    const replacement=link(displaySource());gl.deleteProgram(image.p);image=replacement;show();
});
element('play').onclick=()=>{
    playing=!playing;element('step').hidden=playing;
    element('play').textContent=playing?'Pause':'Play';
};
element('step').onclick=()=>{
    time+=1/60;
    if(scene.kind==='simulation') advanceSimulation(1); else frame++;
    show();
};
element('save').onclick=()=>{
    show();canvas.toBlob(blob=>{
        if(!blob)return;
        const url=URL.createObjectURL(blob), link=document.createElement('a');
        link.href=url;link.download=menu.value+'-'+frame+'.png';link.click();
        setTimeout(()=>URL.revokeObjectURL(url),5000);
    },'image/png');
};
element('reset').onclick=()=>attempt(reset);
element('reuse').onchange=()=>attempt(()=>{
    const replacement=link(displaySource());gl.deleteProgram(image.p);image=replacement;
    refreshTransfer();show();
});
element('size').onchange=()=>attempt(()=>{
    const auto=element('size').value.startsWith('auto');
    resetCadence();
    resizeOutput(auto?640:Number(element('size').value));
    element('scale').hidden=!auto;
    element('scale').value=canvas.width+' × '+canvas.height;
    show();
});
function point(event) {
    const box=canvas.getBoundingClientRect();
    return [(event.clientX-box.left)/box.width,1-(event.clientY-box.top)/box.height];
}
canvas.onpointerdown=e=>{const p=point(e);mouse=[...p,Math.max(p[0],1e-5),p[1]];canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{const p=point(e);mouse[0]=p[0];mouse[1]=p[1];};
canvas.onpointerup=canvas.onpointercancel=()=>{mouse[2]=-Math.abs(mouse[2]);mouse[3]=-Math.abs(mouse[3]);};
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(nextFrame);element('error').textContent='WebGL context lost. Waiting for restore.';});
canvas.addEventListener('webglcontextrestored',()=>location.reload());
attempt(()=>{
    if(!gl)throw Error('WebGL2 is unavailable in this browser.');
    vs=compile(gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(2.*p-1.,0,1);}');
    load();
});
