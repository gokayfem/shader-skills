const DATA={"prelude":"#version 300 es\nprecision highp float;\nprecision highp int;\nprecision mediump sampler3D;\nuniform vec3 iResolution;\nuniform float iTime;\nuniform float iTimeDelta;\nuniform float iFrameRate;\nuniform int iFrame;\nuniform vec4 iMouse;\nuniform vec4 iDate;\nuniform float iChannelTime[4];\nuniform vec3 iChannelResolution[4];\nuniform highp sampler2D iChannel0;\nuniform highp sampler2D iChannel1;\nuniform highp sampler2D iChannel2;\nuniform highp sampler2D iChannel3;\nout vec4 st_FragColor;\n","main":"\nvoid main() { mainImage(st_FragColor, gl_FragCoord.xy); st_FragColor.a = 1.0; }\n","scenes":{"alpine-valley":{"image":"// Alpine valley: designed lowland corridor, multiscale ridges, snow accumulation, strata and aerial depth.\n// A heightfield cannot make overhangs. The controlled valley is not a drainage/erosion simulation.\n// @render time=0.0\n// @variant DEBUG_MODE=1\n// @variant DEBUG_MODE=2\n// @variant DEBUG_MODE=3\n// @variant DEBUG_MODE=4\n#define DEBUG_MODE 0 // 0 beauty | 1 elevation | 2 normal | 3 grass/rock/snow | 4 steps\n\n// Library code below is bundled from shader-skills (MIT): https://github.com/gokayfem/shader-skills\n// ---- shader-skills library: common ----\nconst float PI  = 3.14159265358979;\nconst float TAU = 6.28318530717959;\n\n// ---- shader-skills library: hash ----\nuint pcgHash(uint v) {\n    uint state = v * 747796405u + 2891336453u;\n    uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;\n    return (word >> 22u) ^ word;\n}\nuvec3 pcg3d(uvec3 v) {\n    v = v * 1664525u + 1013904223u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    v ^= v >> 16u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    return v;\n}\nfloat uintToUnit(uint h) { return float(h >> 8u) * (1.0 / 16777216.0); }\nvec2 uintToUnit(uvec2 h) { return vec2(h >> 8u) * (1.0 / 16777216.0); }\nvec3 uintToUnit(uvec3 h) { return vec3(h >> 8u) * (1.0 / 16777216.0); }\nvec4 uintToUnit(uvec4 h) { return vec4(h >> 8u) * (1.0 / 16777216.0); }\nfloat hash12(vec2 p) {\n    uvec2 q = uvec2(ivec2(floor(p)));\n    return uintToUnit(pcgHash(q.x + pcgHash(q.y)));\n}\nvec2 hash22(vec2 p) {\n    ivec2 q = ivec2(floor(p));\n    return uintToUnit(pcg3d(uvec3(q.x, q.y, 0x2545u))).xy;\n}\nvec3 hash33(vec3 p) { return uintToUnit(pcg3d(uvec3(ivec3(floor(p))))); }\n\n// ---- shader-skills library: noise ----\nvec2 quinticFade(vec2 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec3 quinticFade(vec3 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec2 quinticFadeDeriv(vec2 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec3 quinticFadeDeriv(vec3 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec2 latticeGradient(vec2 cell) {\n    float a = TAU * hash12(cell);\n    return vec2(cos(a), sin(a));\n}\nvec3 gradientNoiseD(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    vec2 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec2 ga = latticeGradient(i);\n    vec2 gb = latticeGradient(i + vec2(1.0, 0.0));\n    vec2 gc = latticeGradient(i + vec2(0.0, 1.0));\n    vec2 gd = latticeGradient(i + vec2(1.0, 1.0));\n    float va = dot(ga, f);\n    float vb = dot(gb, f - vec2(1.0, 0.0));\n    float vc = dot(gc, f - vec2(0.0, 1.0));\n    float vd = dot(gd, f - vec2(1.0, 1.0));\n    float k = va - vb - vc + vd;\n    float value = va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * k;\n    vec2 deriv = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.x * u.y * (ga - gb - gc + gd)\n               + du * (vec2(vb - va, vc - va) + u.yx * k);\n    return vec3(value, deriv);\n}\nfloat gradientNoise(vec2 p) { return gradientNoiseD(p).x; }\nfloat latticeGradDot(vec3 cell, vec3 corner, vec3 f) {\n    vec3 g = hash33(cell + corner) * 2.0 - 1.0;\n    return dot(g, f - corner);\n}\nfloat gradientNoise(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f);\n    return mix(mix(mix(latticeGradDot(i, vec3(0, 0, 0), f), latticeGradDot(i, vec3(1, 0, 0), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 0), f), latticeGradDot(i, vec3(1, 1, 0), f), u.x), u.y),\n               mix(mix(latticeGradDot(i, vec3(0, 0, 1), f), latticeGradDot(i, vec3(1, 0, 1), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 1), f), latticeGradDot(i, vec3(1, 1, 1), f), u.x), u.y), u.z);\n}\nvec4 gradientNoiseD(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec3 g000 = hash33(i) * 2.0 - 1.0;\n    vec3 g100 = hash33(i + vec3(1, 0, 0)) * 2.0 - 1.0;\n    vec3 g010 = hash33(i + vec3(0, 1, 0)) * 2.0 - 1.0;\n    vec3 g110 = hash33(i + vec3(1, 1, 0)) * 2.0 - 1.0;\n    vec3 g001 = hash33(i + vec3(0, 0, 1)) * 2.0 - 1.0;\n    vec3 g101 = hash33(i + vec3(1, 0, 1)) * 2.0 - 1.0;\n    vec3 g011 = hash33(i + vec3(0, 1, 1)) * 2.0 - 1.0;\n    vec3 g111 = hash33(i + vec3(1, 1, 1)) * 2.0 - 1.0;\n    float v000 = dot(g000, f);\n    float v100 = dot(g100, f - vec3(1, 0, 0));\n    float v010 = dot(g010, f - vec3(0, 1, 0));\n    float v110 = dot(g110, f - vec3(1, 1, 0));\n    float v001 = dot(g001, f - vec3(0, 0, 1));\n    float v101 = dot(g101, f - vec3(1, 0, 1));\n    float v011 = dot(g011, f - vec3(0, 1, 1));\n    float v111 = dot(g111, f - vec3(1, 1, 1));\n    // value = v000 + kx u.x + ky u.y + kz u.z + kxy u.x u.y + kyz u.y u.z + kzx u.z u.x + kxyz u.x u.y u.z\n    float kx = v100 - v000, ky = v010 - v000, kz = v001 - v000;\n    float kxy = v000 - v100 - v010 + v110;\n    float kyz = v000 - v010 - v001 + v011;\n    float kzx = v000 - v100 - v001 + v101;\n    float kxyz = -v000 + v100 + v010 - v110 + v001 - v101 - v011 + v111;\n    float value = v000 + kx * u.x + ky * u.y + kz * u.z\n                + kxy * u.x * u.y + kyz * u.y * u.z + kzx * u.z * u.x + kxyz * u.x * u.y * u.z;\n    vec3 grad = g000 + (g100 - g000) * u.x + (g010 - g000) * u.y + (g001 - g000) * u.z\n              + (g000 - g100 - g010 + g110) * u.x * u.y\n              + (g000 - g010 - g001 + g011) * u.y * u.z\n              + (g000 - g100 - g001 + g101) * u.z * u.x\n              + (-g000 + g100 + g010 - g110 + g001 - g101 - g011 + g111) * u.x * u.y * u.z\n              + du * vec3(kx + kxy * u.y + kzx * u.z + kxyz * u.y * u.z,\n                          ky + kxy * u.x + kyz * u.z + kxyz * u.x * u.z,\n                          kz + kyz * u.y + kzx * u.x + kxyz * u.x * u.y);\n    return vec4(value, grad);\n}\nconst int FBM_MAX_OCTAVES = 12;\nfloat fbm(vec2 p, int octaves, float lacunarity, float persistence) {\n    const mat2 octaveRotation = mat2(0.8, 0.6, -0.6, 0.8);\n    float sum = 0.0, amp = 1.0, norm = 0.0;\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        sum += amp * gradientNoise(p);\n        norm += amp;\n        amp *= persistence;\n        p = lacunarity * (octaveRotation * p) + vec2(17.13, -3.71);\n    }\n    return 1.4 * sum / norm;\n}\nfloat fbm(vec2 p, int octaves) { return fbm(p, octaves, 2.01, 0.5); }\nfloat fbm(vec3 p, int octaves, float lacunarity, float persistence) {\n    const mat3 octaveRotation = mat3(0.00, 0.80, 0.60,\n                                     -0.80, 0.36, -0.48,\n                                     -0.60, -0.48, 0.64);\n    float sum = 0.0, amp = 1.0, norm = 0.0;\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        sum += amp * gradientNoise(p);\n        norm += amp;\n        amp *= persistence;\n        p = lacunarity * (octaveRotation * p) + vec3(17.13, -3.71, 5.29);\n    }\n    return sum / norm;\n}\nfloat erodedFbm(vec2 p, int octaves) {\n    const mat2 octaveRotation = mat2(0.8, 0.6, -0.6, 0.8);\n    float h = 0.0, amp = 0.5;\n    vec2 slope = vec2(0.0);\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        vec3 n = gradientNoiseD(p);\n        slope += n.yz;\n        h += amp * n.x / (1.0 + dot(slope, slope));\n        amp *= 0.5;\n        p = 2.0 * (octaveRotation * p);\n    }\n    return 2.0 * h;\n}\nfloat ridgedFbm(vec2 p, int octaves) {\n    const mat2 octaveRotation = mat2(0.8, 0.6, -0.6, 0.8);\n    float sum = 0.0, amp = 0.5, weight = 1.0, norm = 0.0;\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        float n = 1.0 - abs(gradientNoise(p) * 1.4);\n        n *= n;\n        sum += amp * n * weight;\n        norm += amp;\n        weight = clamp(n * 2.0, 0.0, 1.0);\n        amp *= 0.5;\n        p = 2.01 * (octaveRotation * p) + vec2(17.13, -3.71);\n    }\n    return sum / norm;\n}\n\n// ---- shader-skills library: raymarch ----\n#define ZERO (min(iFrame, 0))\nvec2 map(vec3 p);\nvec3 calcNormal(vec3 p, float eps) {\n    vec3 n = vec3(0.0);\n    for (int i = ZERO; i < 4; i++) {\n        vec3 e = 0.5773 * (2.0 * vec3((((i + 3) >> 1) & 1), ((i >> 1) & 1), (i & 1)) - 1.0);\n        n += e * map(p + e * eps).x;\n    }\n    return normalize(n);\n}\nfloat softShadow(vec3 ro, vec3 rd, float tmin, float tmax, float k) {\n    float res = 1.0;\n    float t = tmin;\n    float ph = 1e10;\n    for (int i = ZERO; i < 64; i++) {\n        float h = map(ro + rd * t).x;\n        if (h < 0.0001) return 0.0;\n        float y = h * h / (2.0 * ph);\n        float d = sqrt(max(h * h - y * y, 0.0));\n        res = min(res, k * d / max(t - y, 1e-4));\n        ph = h;\n        t += clamp(h, 0.005, 0.5);\n        if (res < 0.001 || t > tmax) break;\n    }\n    res = clamp(res, 0.0, 1.0);\n    return res * res * (3.0 - 2.0 * res);\n}\n\n// ---- shader-skills library: camera ----\nmat3 cameraMatrix(vec3 ro, vec3 ta, float roll) {\n    vec3 w = normalize(ta - ro);\n    vec3 up = vec3(sin(roll), cos(roll), 0.0);\n    vec3 u = normalize(cross(w, up));\n    vec3 v = cross(u, w);\n    return mat3(u, v, w);\n}\nvec3 cameraRay(mat3 cam, vec2 uv, float focal) {\n    return normalize(cam * vec3(uv, focal));\n}\n\n// ---- shader-skills library: shading ----\nvec3 fresnelSchlick(float u, vec3 f0) {\n    float m = clamp(1.0 - u, 0.0, 1.0);\n    float m2 = m * m;\n    return f0 + (1.0 - f0) * (m2 * m2 * m);\n}\nfloat distributionGGX(float NoH, float alpha) {\n    float a2 = alpha * alpha;\n    float d = NoH * NoH * (a2 - 1.0) + 1.0;\n    return a2 / (PI * d * d);\n}\nfloat visibilitySmithGGX(float NoV, float NoL, float alpha) {\n    float a2 = alpha * alpha;\n    float gv = NoL * sqrt(NoV * NoV * (1.0 - a2) + a2);\n    float gl = NoV * sqrt(NoL * NoL * (1.0 - a2) + a2);\n    return 0.5 / max(gv + gl, 1e-6);\n}\nvec3 specularGGX(vec3 n, vec3 v, vec3 l, float roughness, vec3 f0) {\n    vec3 h = normalize(v + l);\n    float NoL = clamp(dot(n, l), 0.0, 1.0);\n    float NoV = max(dot(n, v), 1e-4);\n    float NoH = clamp(dot(n, h), 0.0, 1.0);\n    float VoH = clamp(dot(v, h), 0.0, 1.0);\n    float alpha = max(roughness, 0.045);\n    alpha *= alpha;\n    return PI * distributionGGX(NoH, alpha) * visibilitySmithGGX(NoV, NoL, alpha) * fresnelSchlick(VoH, f0) * NoL;\n}\nvec3 shadePBR(vec3 n, vec3 v, vec3 l, vec3 albedo, float roughness, float metallic) {\n    vec3 f0 = mix(vec3(0.04), albedo, metallic);\n    float NoL = clamp(dot(n, l), 0.0, 1.0);\n    vec3 F = fresnelSchlick(max(dot(n, v), 0.0), f0);\n    vec3 diffuse = albedo * (1.0 - metallic) * (1.0 - F) * NoL;\n    return diffuse + specularGGX(n, v, l, roughness, f0);\n}\nvec3 hemisphereLight(vec3 n, vec3 skyColor, vec3 groundColor) {\n    return mix(groundColor, skyColor, 0.5 + 0.5 * n.y);\n}\n\n// ---- shader-skills library: color ----\nvec3 linearToSrgb(vec3 c) {\n    c = max(c, 0.0);\n    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));\n}\n\n// ---- shader-skills library: tonemap ----\nvec3 tonemapAgX(vec3 c) {\n    const mat3 inset = mat3(0.842479062253094, 0.0423282422610123, 0.0423756549057051,\n                            0.0784335999999992, 0.878468636469772, 0.0784336,\n                            0.0792237451477643, 0.0791661274605434, 0.879142973793104);\n    const mat3 outset = mat3(1.19687900512017, -0.0528968517574562, -0.0529716355144438,\n                             -0.0980208811401368, 1.15190312990417, -0.0980434501171241,\n                             -0.0990297440797205, -0.0989611768448433, 1.15107367264116);\n    const float minEv = -12.47393, maxEv = 4.026069;\n    c = inset * max(c, 0.0);\n    c = clamp((log2(max(c, 1e-10)) - minEv) / (maxEv - minEv), 0.0, 1.0);\n    vec3 x2 = c * c, x4 = x2 * x2;\n    c = 15.5 * x4 * x2 - 40.14 * x4 * c + 31.96 * x4 - 6.868 * x2 * c + 0.4298 * x2 + 0.1191 * c - 0.00232;\n    c = outset * c;\n    return pow(max(c, 0.0), vec3(2.2));\n}\n\n// ---- shader-skills library: volume ----\nfloat heightFog(vec3 ro, vec3 rd, float t, float a, float b) {\n    float base = a * exp(-ro.y * b);\n    float amount = (abs(rd.y) < 1e-4) ? base * t\n                                       : base * (1.0 - exp(-t * rd.y * b)) / (rd.y * b);\n    return 1.0 - exp(-max(amount, 0.0));\n}\n\n// ---- shader-skills library: atmosphere ----\nvec3 simpleSky(vec3 rd, vec3 sunDir) {\n    float y = max(rd.y, 0.0);\n    vec3 zenith = vec3(0.12, 0.28, 0.62);\n    vec3 horizon = vec3(0.62, 0.74, 0.88);\n    vec3 col = mix(horizon, zenith, pow(y, 0.5));\n    col = mix(col, vec3(0.28, 0.26, 0.24), 1.0 - smoothstep(-0.08, 0.0, rd.y));\n    float mu = max(dot(rd, sunDir), 0.0);\n    col += vec3(1.0, 0.75, 0.45) * (0.25 * pow(mu, 8.0) + 0.6 * pow(mu, 64.0) + 2.0 * pow(mu, 512.0));\n    return col;\n}\n\n// ---- shader-skills library: post ----\nvec3 ditherTPDF(vec2 fragCoord, int frame) {\n    vec2 r = hash22(vec2(floor(fragCoord) + 7919.0 * float(frame % 1024)));\n    return vec3((r.x + r.y - 1.0) / 255.0);\n}\n\n// ---- shader-skills library: debug ----\nvec3 debugHeat(float t) {\n    t = clamp(t, 0.0, 1.0);\n    return clamp(vec3(1.5 * t, 1.6 * t * t * t - 0.1, 0.9 * sin(PI * t) + 0.2 * t * t), 0.0, 1.0);\n}\n\n// ---- shader ----\nconst vec3 ALPINE_SUN=normalize(vec3(-0.65,0.42,-0.25));\nconst float SNOW_ALTITUDE=1.9;\nconst float FAR_DISTANCE=70.0;\nconst int ALPINE_TRACE_STEPS=320;\n\nfloat alpineValleyMask(float x) { return 1.0-exp(-0.085*x*x); }\n\n// The unit-gradient corner dots are bounded by sqrt(2); quintic interpolation is convex.\n// Thus |fbm| < 2, |erodedFbm| < 2*sqrt(2), and ridgedFbm <= 1. With the height\n// coefficients below, 0.31 + 23*valley bounds the full terrain before evaluating noise.\nfloat alpineCeiling(float x) { return 0.31 + 23.0 * alpineValleyMask(x); }\n\nfloat alpineHeight(vec2 p) {\n    float valley=alpineValleyMask(p.x);\n    float peaks=0.65+1.8*erodedFbm(p*vec2(0.30,0.25)+vec2(2.0,7.0),6)\n                +0.35*ridgedFbm(p*0.2,4);\n    float broad=0.5+0.5*fbm(p*0.12,4);\n    float detail=0.06*fbm(p*1.8,3);\n    return 0.18+(1.3+3.1*peaks+1.0*broad)*valley+detail;\n}\n\nvec2 map(vec3 p) {return vec2((p.y-alpineHeight(p.xz))*0.12,1.0);}\n\n// Coarse-to-fine heightfield intersection. Distance-proportional sampling avoids the asymptotic\n// slowdown of a small globally scaled gap near the horizon; crossings are refined by bisection.\nvec3 traceAlpine(vec3 ro,vec3 rd) {\n    float t=0.02,previous=0.0;\n    for(int i=0;i<ALPINE_TRACE_STEPS;i++) {\n        vec3 p=ro+rd*t;\n        if (rd.y >= 0.0 && p.y > 23.31) break;\n        if (p.y <= alpineCeiling(p.x) && p.y < alpineHeight(p.xz)) {\n            float lo=previous,hi=t;\n            for(int j=0;j<10;j++) {\n                float mid=0.5*(lo+hi);\n                vec3 q=ro+rd*mid;\n                if(q.y>alpineHeight(q.xz))lo=mid;else hi=mid;\n            }\n            return vec3(0.5*(lo+hi),1.0,float(i));\n        }\n        previous=t;\n        t+=0.04+0.015*t;\n        if(t>FAR_DISTANCE)break;\n    }\n    return vec3(-1.0,0.0,float(ALPINE_TRACE_STEPS));\n}\n\nvec3 alpineSky(vec3 rd) {\n    vec3 c=simpleSky(rd,ALPINE_SUN);\n    // A broad cloud mask in sky-direction space; it is not a cloud volume.\n    float cloud=smoothstep(0.1,0.5,fbm(rd.xz/max(rd.y+0.45,0.15)*1.2,4));\n    return mix(c,vec3(0.86,0.88,0.91),cloud*0.45*smoothstep(0.05,0.4,rd.y));\n}\n\nvec3 alpineRender(vec2 coord) {\n    vec2 uv=(2.0*coord-iResolution.xy)/iResolution.y;\n    vec3 ro=vec3(0.15,2.1,10.0-0.25*iTime);\n    ro.y=max(ro.y,alpineHeight(ro.xz)+0.7);\n    vec3 rd=cameraRay(cameraMatrix(ro,vec3(0.0,1.9,-15.0),0.0),uv,1.8);\n    vec3 hit=traceAlpine(ro,rd);\n#if DEBUG_MODE == 4\n    return debugHeat(hit.z/float(ALPINE_TRACE_STEPS));\n#endif\n    if(hit.x<0.0)return alpineSky(rd);\n    vec3 p=ro+rd*hit.x;\n    float footprint=hit.x*2.0/(iResolution.y*1.8);\n    vec3 n=calcNormal(p,max(0.002,footprint*0.5));\n    float snow=smoothstep(SNOW_ALTITUDE-0.3,SNOW_ALTITUDE+0.4,p.y+0.22*fbm(p.xz*2.0,3))\n              *smoothstep(0.35,0.75,n.y);\n    float grass=smoothstep(0.6,0.9,n.y)*(1.0-smoothstep(1.4,2.5,p.y));\n    float detailKeep=1.0-smoothstep(0.02,0.2,footprint);\n    float grain=0.5+0.5*fbm(p.xz*18.0,3)*detailKeep;\n    float strata=0.5+0.5*sin(p.y*35.0+fbm(p.xz*3.0,3)*2.0);\n    vec3 rock=mix(vec3(0.16,0.15,0.14),vec3(0.32,0.29,0.25),grain)*(0.85+0.15*strata*detailKeep);\n    vec3 albedo=mix(rock,mix(vec3(0.075,0.12,0.035),vec3(0.16,0.20,0.065),grain),grass);\n    albedo=mix(albedo,vec3(0.78,0.84,0.9),snow);\n    float shadow=softShadow(p+n*0.03,ALPINE_SUN,0.03,15.0,12.0);\n    vec3 col=shadePBR(n,-rd,ALPINE_SUN,albedo,0.8,0.0)*vec3(3.4,3.0,2.5)*shadow;\n    col+=albedo*hemisphereLight(n,vec3(0.4,0.58,0.85),vec3(0.16,0.13,0.095));\n#if DEBUG_MODE == 1\n    return vec3(p.y/6.0);\n#elif DEBUG_MODE == 2\n    return n*0.5+0.5;\n#elif DEBUG_MODE == 3\n    return vec3(grass,1.0-grass,snow);\n#endif\n    vec3 haze=alpineSky(normalize(vec3(rd.x,0.04,rd.z)));\n    float fog=heightFog(ro,rd,hit.x,0.011,0.18);\n    return mix(col,haze,fog);\n}\n\nvoid mainImage(out vec4 fragColor,in vec2 fragCoord) {\n    vec3 col=alpineRender(fragCoord);\n#if DEBUG_MODE == 0\n    col=linearToSrgb(tonemapAgX(col*1.15))+ditherTPDF(fragCoord,iFrame);\n#endif\n    fragColor=vec4(col,1.0);\n}\n","time":0.0,"modes":[0,1,2,3,4]},"banded-agate":{"image":"// Backlit agate cross-section: iron-oxide rind, chalcedony growth bands and a faceted quartz pocket.\n// @render time=2.5\n// @variant DEBUG_MODE=3\n#define DEBUG_MODE 0   // 0 final | 3 quartz, chalcedony and rind masks\n\n// Library code below is bundled from shader-skills (MIT): https://github.com/gokayfem/shader-skills\n// ---- shader-skills library: common ----\nconst float TAU = 6.28318530717959;\nfloat dot2(vec2 v) { return dot(v, v); }\nfloat dot2(vec3 v) { return dot(v, v); }\nmat2 rot2(float a) {\n    vec2 cs = normalize(vec2(cos(a), sin(a)));\n    return mat2(cs.x, cs.y, -cs.y, cs.x);\n}\n\n// ---- shader-skills library: hash ----\nuint pcgHash(uint v) {\n    uint state = v * 747796405u + 2891336453u;\n    uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;\n    return (word >> 22u) ^ word;\n}\nuvec3 pcg3d(uvec3 v) {\n    v = v * 1664525u + 1013904223u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    v ^= v >> 16u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    return v;\n}\nfloat uintToUnit(uint h) { return float(h >> 8u) * (1.0 / 16777216.0); }\nvec2 uintToUnit(uvec2 h) { return vec2(h >> 8u) * (1.0 / 16777216.0); }\nvec3 uintToUnit(uvec3 h) { return vec3(h >> 8u) * (1.0 / 16777216.0); }\nvec4 uintToUnit(uvec4 h) { return vec4(h >> 8u) * (1.0 / 16777216.0); }\nfloat hash12(vec2 p) {\n    uvec2 q = uvec2(ivec2(floor(p)));\n    return uintToUnit(pcgHash(q.x + pcgHash(q.y)));\n}\nvec2 hash22(vec2 p) {\n    ivec2 q = ivec2(floor(p));\n    return uintToUnit(pcg3d(uvec3(q.x, q.y, 0x2545u))).xy;\n}\nvec3 hash33(vec3 p) { return uintToUnit(pcg3d(uvec3(ivec3(floor(p))))); }\n\n// ---- shader-skills library: noise ----\nvec2 quinticFade(vec2 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec3 quinticFade(vec3 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec2 quinticFadeDeriv(vec2 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec3 quinticFadeDeriv(vec3 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec2 latticeGradient(vec2 cell) {\n    float a = TAU * hash12(cell);\n    return vec2(cos(a), sin(a));\n}\nvec3 gradientNoiseD(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    vec2 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec2 ga = latticeGradient(i);\n    vec2 gb = latticeGradient(i + vec2(1.0, 0.0));\n    vec2 gc = latticeGradient(i + vec2(0.0, 1.0));\n    vec2 gd = latticeGradient(i + vec2(1.0, 1.0));\n    float va = dot(ga, f);\n    float vb = dot(gb, f - vec2(1.0, 0.0));\n    float vc = dot(gc, f - vec2(0.0, 1.0));\n    float vd = dot(gd, f - vec2(1.0, 1.0));\n    float k = va - vb - vc + vd;\n    float value = va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * k;\n    vec2 deriv = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.x * u.y * (ga - gb - gc + gd)\n               + du * (vec2(vb - va, vc - va) + u.yx * k);\n    return vec3(value, deriv);\n}\nfloat gradientNoise(vec2 p) { return gradientNoiseD(p).x; }\nfloat latticeGradDot(vec3 cell, vec3 corner, vec3 f) {\n    vec3 g = hash33(cell + corner) * 2.0 - 1.0;\n    return dot(g, f - corner);\n}\nfloat gradientNoise(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f);\n    return mix(mix(mix(latticeGradDot(i, vec3(0, 0, 0), f), latticeGradDot(i, vec3(1, 0, 0), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 0), f), latticeGradDot(i, vec3(1, 1, 0), f), u.x), u.y),\n               mix(mix(latticeGradDot(i, vec3(0, 0, 1), f), latticeGradDot(i, vec3(1, 0, 1), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 1), f), latticeGradDot(i, vec3(1, 1, 1), f), u.x), u.y), u.z);\n}\nvec4 gradientNoiseD(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec3 g000 = hash33(i) * 2.0 - 1.0;\n    vec3 g100 = hash33(i + vec3(1, 0, 0)) * 2.0 - 1.0;\n    vec3 g010 = hash33(i + vec3(0, 1, 0)) * 2.0 - 1.0;\n    vec3 g110 = hash33(i + vec3(1, 1, 0)) * 2.0 - 1.0;\n    vec3 g001 = hash33(i + vec3(0, 0, 1)) * 2.0 - 1.0;\n    vec3 g101 = hash33(i + vec3(1, 0, 1)) * 2.0 - 1.0;\n    vec3 g011 = hash33(i + vec3(0, 1, 1)) * 2.0 - 1.0;\n    vec3 g111 = hash33(i + vec3(1, 1, 1)) * 2.0 - 1.0;\n    float v000 = dot(g000, f);\n    float v100 = dot(g100, f - vec3(1, 0, 0));\n    float v010 = dot(g010, f - vec3(0, 1, 0));\n    float v110 = dot(g110, f - vec3(1, 1, 0));\n    float v001 = dot(g001, f - vec3(0, 0, 1));\n    float v101 = dot(g101, f - vec3(1, 0, 1));\n    float v011 = dot(g011, f - vec3(0, 1, 1));\n    float v111 = dot(g111, f - vec3(1, 1, 1));\n    // value = v000 + kx u.x + ky u.y + kz u.z + kxy u.x u.y + kyz u.y u.z + kzx u.z u.x + kxyz u.x u.y u.z\n    float kx = v100 - v000, ky = v010 - v000, kz = v001 - v000;\n    float kxy = v000 - v100 - v010 + v110;\n    float kyz = v000 - v010 - v001 + v011;\n    float kzx = v000 - v100 - v001 + v101;\n    float kxyz = -v000 + v100 + v010 - v110 + v001 - v101 - v011 + v111;\n    float value = v000 + kx * u.x + ky * u.y + kz * u.z\n                + kxy * u.x * u.y + kyz * u.y * u.z + kzx * u.z * u.x + kxyz * u.x * u.y * u.z;\n    vec3 grad = g000 + (g100 - g000) * u.x + (g010 - g000) * u.y + (g001 - g000) * u.z\n              + (g000 - g100 - g010 + g110) * u.x * u.y\n              + (g000 - g010 - g001 + g011) * u.y * u.z\n              + (g000 - g100 - g001 + g101) * u.z * u.x\n              + (-g000 + g100 + g010 - g110 + g001 - g101 - g011 + g111) * u.x * u.y * u.z\n              + du * vec3(kx + kxy * u.y + kzx * u.z + kxyz * u.y * u.z,\n                          ky + kxy * u.x + kyz * u.z + kxyz * u.x * u.z,\n                          kz + kyz * u.y + kzx * u.x + kxyz * u.x * u.y);\n    return vec4(value, grad);\n}\nconst int FBM_MAX_OCTAVES = 12;\nfloat fbmLod(vec2 p, int octaves, float footprint) {\n    int count = clamp(octaves, 0, FBM_MAX_OCTAVES);\n    if (count == 0) return 0.0;\n    float width = max(footprint, 0.0);\n    float sum = 0.0, amplitude = 1.0;\n    const mat2 rotation = mat2(0.8, 0.6, -0.6, 0.8);\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= count || width >= 0.5) break;\n        float keep = 1.0 - smoothstep(0.25, 0.5, width);\n        sum += amplitude * keep * gradientNoise(p);\n        p = 2.01 * (rotation * p) + vec2(17.13, -3.71);\n        amplitude *= 0.5;\n        width *= 2.01;\n    }\n    // Normalize by the requested spectrum so removing detail never boosts the remaining bands.\n    return 1.4 * sum / (2.0 * (1.0 - exp2(-float(count))));\n}\nvec3 voronoiBorder(vec2 p, float jitter) {\n    vec2 ip = floor(p), fp = fract(p);\n    vec2 mg = vec2(0.0), mr = vec2(0.0);\n    float md = 8.0;\n    for (int j = -1; j <= 1; j++)\n    for (int i = -1; i <= 1; i++) {\n        vec2 g = vec2(float(i), float(j));\n        vec2 r = g + jitter * hash22(ip + g) - fp;\n        float d = dot(r, r);\n        if (d < md) { md = d; mr = r; mg = g; }\n    }\n    md = 8.0;\n    for (int j = -2; j <= 2; j++)\n    for (int i = -2; i <= 2; i++) {\n        vec2 g = mg + vec2(float(i), float(j));\n        vec2 r = g + jitter * hash22(ip + g) - fp;\n        if (dot2(mr - r) > 1e-5) {\n            md = min(md, dot(0.5 * (mr + r), normalize(r - mr)));\n        }\n    }\n    return vec3(md, mr);\n}\n\n// ---- shader-skills library: pattern ----\nfloat filteredStripes(float x, float w) {\n    w = max(w, 1e-4);\n    float a = x + 0.5 * w, b = x - 0.5 * w;\n    float ia = floor(a) * 0.5 + max(fract(a) - 0.5, 0.0);\n    float ib = floor(b) * 0.5 + max(fract(b) - 0.5, 0.0);\n    return (ia - ib) / w;\n}\n\n// ---- shader-skills library: color ----\nvec3 linearToSrgb(vec3 c) {\n    c = max(c, 0.0);\n    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));\n}\n\n// ---- shader-skills library: tonemap ----\nvec3 tonemapNeutral(vec3 c) {\n    const float startCompression = 0.76;\n    const float desaturation = 0.15;\n    c = max(c, 0.0);\n    float x = min(c.r, min(c.g, c.b));\n    float offset = x < 0.08 ? x - 6.25 * x * x : 0.04;\n    c -= offset;\n    float peak = max(c.r, max(c.g, c.b));\n    if (peak < startCompression) return c;\n    const float d = 1.0 - startCompression;\n    float newPeak = 1.0 - d * d / (peak + d - startCompression);\n    c *= newPeak / peak;\n    float g = 1.0 - 1.0 / (desaturation * (peak - newPeak) + 1.0);\n    return mix(c, vec3(newPeak), g);\n}\n\n// ---- shader-skills library: post ----\nvec3 ditherTPDF(vec2 fragCoord, int frame) {\n    vec2 r = hash22(vec2(floor(fragCoord) + 7919.0 * float(frame % 1024)));\n    return vec3((r.x + r.y - 1.0) / 255.0);\n}\n\n// ---- shader ----\nconst float BAND_COUNT = 27.0;\nconst float BACKLIGHT = 1.25;\nconst float DRIFT = 0.035;\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n    vec2 uv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;\n    vec2 p = rot2(-0.32) * (uv - vec2(-0.22, 0.02));\n    p *= vec2(0.82, 1.32);\n    float px = 2.64 / iResolution.y;\n    float warp = fbmLod(p * 2.1 + vec2(3.2, 0.8), 6, px * 2.1);\n    float field = length(p) + 0.23 * warp + 0.07 * sin(4.0 * p.x - p.y);\n    float phase = field * BAND_COUNT + 0.36 * sin(18.0 * field);\n    float veins = filteredStripes(phase, fwidth(phase));\n    float micro = filteredStripes(phase * 3.0, 3.0 * fwidth(phase));\n    float cloud = fbmLod(p * 10.0, 6, px * 10.0);\n    vec3 teal = mix(vec3(0.012, 0.087, 0.11), vec3(0.10, 0.49, 0.43), veins);\n    vec3 honey = mix(vec3(0.31, 0.069, 0.022), vec3(1.05, 0.50, 0.14), veins);\n    float iron = smoothstep(-0.22, 0.65, sin(field * 19.0 + 1.0) + 0.45 * warp);\n    vec3 bands = mix(teal, honey, iron) * (0.80 + 0.24 * micro + 0.36 * cloud);\n    float milky = filteredStripes(phase * 0.27, fwidth(phase) * 0.27) * (0.17 + 0.12 * cloud);\n    bands = mix(bands, vec3(0.83, 0.84, 0.66), milky);\n\n    float w = max(fwidth(field), 0.0001);\n    float core = 1.0 - smoothstep(0.35 - w, 0.35 + w, field);\n    float rind = smoothstep(1.03 - w, 1.03 + w, field);\n    vec3 stone = mix(bands, vec3(0.18, 0.087, 0.038) * (1.0 + cloud), rind);\n    if (core > 0.0) {\n        vec2 crystalUV = p * 18.0;\n        vec3 cell = voronoiBorder(crystalUV, 0.95);\n        vec2 id = floor(crystalUV + cell.yz);\n        float face = hash12(id);\n        float ridge = 1.0 - smoothstep(0.0, 0.085 + px * 18.0, cell.x);\n        float flash = pow(max(0.0, cos(6.283 * face + DRIFT * iTime)), 18.0);\n        vec3 quartz = mix(vec3(0.09, 0.19, 0.22), vec3(0.68, 0.81, 0.77), face);\n        // Plane breaks meet at the seed inside each crystal.\n        vec2 axis = vec2(cos(6.283 * face), sin(6.283 * face));\n        float facet = dot(cell.yz, axis) + 0.35 * abs(dot(cell.yz, vec2(-axis.y, axis.x)));\n        float plane = smoothstep(-px * 18.0, px * 18.0, facet);\n        stone = mix(stone, quartz * (0.46 + 0.44 * plane + 0.5 * cell.x) + ridge * (0.18 + flash), core);\n    }\n    float outline = 1.0 - smoothstep(1.085 - w, 1.085 + w, field);\n    float glow = exp(-1.9 * length(p - vec2(-0.42, 0.24)));\n    vec3 backdrop = vec3(0.013, 0.020, 0.025) * (1.0 + 0.4 * uv.y);\n    vec3 color = mix(backdrop, stone * (0.74 + BACKLIGHT * glow), outline);\n#if DEBUG_MODE == 3\n    color = outline * vec3(core, (1.0 - core) * (1.0 - rind), rind);\n#endif\n    fragColor = vec4(linearToSrgb(tonemapNeutral(color)) + ditherTPDF(fragCoord, iFrame), 1.0);\n}\n","time":2.5,"modes":[0,3]},"cloudline-forest":{"image":"// Alpine firs drawn as bounded clusters. Subpixel branches collapse into a crown silhouette.\n// @render time=2.0\n// @variant DEBUG_MODE=4\n#define DEBUG_MODE 0 // 4 warm = explicit boughs, blue = crown proxy\n\n// Library code below is bundled from shader-skills (MIT): https://github.com/gokayfem/shader-skills\n// ---- shader-skills library: common ----\nconst float TAU = 6.28318530717959;\n\n// ---- shader-skills library: hash ----\nuint pcgHash(uint v) {\n    uint state = v * 747796405u + 2891336453u;\n    uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;\n    return (word >> 22u) ^ word;\n}\nuvec3 pcg3d(uvec3 v) {\n    v = v * 1664525u + 1013904223u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    v ^= v >> 16u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    return v;\n}\nfloat uintToUnit(uint h) { return float(h >> 8u) * (1.0 / 16777216.0); }\nvec2 uintToUnit(uvec2 h) { return vec2(h >> 8u) * (1.0 / 16777216.0); }\nvec3 uintToUnit(uvec3 h) { return vec3(h >> 8u) * (1.0 / 16777216.0); }\nvec4 uintToUnit(uvec4 h) { return vec4(h >> 8u) * (1.0 / 16777216.0); }\nfloat hash12(vec2 p) {\n    uvec2 q = uvec2(ivec2(floor(p)));\n    return uintToUnit(pcgHash(q.x + pcgHash(q.y)));\n}\nvec3 hash33(vec3 p) { return uintToUnit(pcg3d(uvec3(ivec3(floor(p))))); }\nvec3 hash32(vec2 p) {\n    ivec2 q = ivec2(floor(p));\n    return uintToUnit(pcg3d(uvec3(q.x, q.y, 0x9E37u)));\n}\n\n// ---- shader-skills library: noise ----\nvec2 quinticFade(vec2 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec3 quinticFade(vec3 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec2 quinticFadeDeriv(vec2 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec3 quinticFadeDeriv(vec3 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec2 latticeGradient(vec2 cell) {\n    float a = TAU * hash12(cell);\n    return vec2(cos(a), sin(a));\n}\nvec3 gradientNoiseD(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    vec2 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec2 ga = latticeGradient(i);\n    vec2 gb = latticeGradient(i + vec2(1.0, 0.0));\n    vec2 gc = latticeGradient(i + vec2(0.0, 1.0));\n    vec2 gd = latticeGradient(i + vec2(1.0, 1.0));\n    float va = dot(ga, f);\n    float vb = dot(gb, f - vec2(1.0, 0.0));\n    float vc = dot(gc, f - vec2(0.0, 1.0));\n    float vd = dot(gd, f - vec2(1.0, 1.0));\n    float k = va - vb - vc + vd;\n    float value = va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * k;\n    vec2 deriv = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.x * u.y * (ga - gb - gc + gd)\n               + du * (vec2(vb - va, vc - va) + u.yx * k);\n    return vec3(value, deriv);\n}\nfloat gradientNoise(vec2 p) { return gradientNoiseD(p).x; }\nfloat latticeGradDot(vec3 cell, vec3 corner, vec3 f) {\n    vec3 g = hash33(cell + corner) * 2.0 - 1.0;\n    return dot(g, f - corner);\n}\nfloat gradientNoise(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f);\n    return mix(mix(mix(latticeGradDot(i, vec3(0, 0, 0), f), latticeGradDot(i, vec3(1, 0, 0), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 0), f), latticeGradDot(i, vec3(1, 1, 0), f), u.x), u.y),\n               mix(mix(latticeGradDot(i, vec3(0, 0, 1), f), latticeGradDot(i, vec3(1, 0, 1), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 1), f), latticeGradDot(i, vec3(1, 1, 1), f), u.x), u.y), u.z);\n}\nvec4 gradientNoiseD(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec3 g000 = hash33(i) * 2.0 - 1.0;\n    vec3 g100 = hash33(i + vec3(1, 0, 0)) * 2.0 - 1.0;\n    vec3 g010 = hash33(i + vec3(0, 1, 0)) * 2.0 - 1.0;\n    vec3 g110 = hash33(i + vec3(1, 1, 0)) * 2.0 - 1.0;\n    vec3 g001 = hash33(i + vec3(0, 0, 1)) * 2.0 - 1.0;\n    vec3 g101 = hash33(i + vec3(1, 0, 1)) * 2.0 - 1.0;\n    vec3 g011 = hash33(i + vec3(0, 1, 1)) * 2.0 - 1.0;\n    vec3 g111 = hash33(i + vec3(1, 1, 1)) * 2.0 - 1.0;\n    float v000 = dot(g000, f);\n    float v100 = dot(g100, f - vec3(1, 0, 0));\n    float v010 = dot(g010, f - vec3(0, 1, 0));\n    float v110 = dot(g110, f - vec3(1, 1, 0));\n    float v001 = dot(g001, f - vec3(0, 0, 1));\n    float v101 = dot(g101, f - vec3(1, 0, 1));\n    float v011 = dot(g011, f - vec3(0, 1, 1));\n    float v111 = dot(g111, f - vec3(1, 1, 1));\n    // value = v000 + kx u.x + ky u.y + kz u.z + kxy u.x u.y + kyz u.y u.z + kzx u.z u.x + kxyz u.x u.y u.z\n    float kx = v100 - v000, ky = v010 - v000, kz = v001 - v000;\n    float kxy = v000 - v100 - v010 + v110;\n    float kyz = v000 - v010 - v001 + v011;\n    float kzx = v000 - v100 - v001 + v101;\n    float kxyz = -v000 + v100 + v010 - v110 + v001 - v101 - v011 + v111;\n    float value = v000 + kx * u.x + ky * u.y + kz * u.z\n                + kxy * u.x * u.y + kyz * u.y * u.z + kzx * u.z * u.x + kxyz * u.x * u.y * u.z;\n    vec3 grad = g000 + (g100 - g000) * u.x + (g010 - g000) * u.y + (g001 - g000) * u.z\n              + (g000 - g100 - g010 + g110) * u.x * u.y\n              + (g000 - g010 - g001 + g011) * u.y * u.z\n              + (g000 - g100 - g001 + g101) * u.z * u.x\n              + (-g000 + g100 + g010 - g110 + g001 - g101 - g011 + g111) * u.x * u.y * u.z\n              + du * vec3(kx + kxy * u.y + kzx * u.z + kxyz * u.y * u.z,\n                          ky + kxy * u.x + kyz * u.z + kxyz * u.x * u.z,\n                          kz + kyz * u.y + kzx * u.x + kxyz * u.x * u.y);\n    return vec4(value, grad);\n}\n\n// ---- shader-skills library: camera ----\nfloat projectedErrorPx(float worldError, float depth, float focal, float imageHeight) {\n    return max(worldError, 0.0) * max(focal, 0.0) * max(imageHeight, 0.0) / (2.0 * max(depth, 1e-5));\n}\n\n// ---- shader-skills library: water ----\nfloat currentBend(float heightFraction, float amplitude, float phase) {\n    float h = clamp(heightFraction, 0.0, 1.0);\n    return amplitude * h * h * (0.72 * sin(phase - 2.4*h) + 0.28 * sin(1.7*phase + 3.1*h));\n}\n\n// ---- shader-skills library: color ----\nvec3 linearToSrgb(vec3 c) {\n    c = max(c, 0.0);\n    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));\n}\n\n// ---- shader-skills library: tonemap ----\nvec3 tonemapNeutral(vec3 c) {\n    const float startCompression = 0.76;\n    const float desaturation = 0.15;\n    c = max(c, 0.0);\n    float x = min(c.r, min(c.g, c.b));\n    float offset = x < 0.08 ? x - 6.25 * x * x : 0.04;\n    c -= offset;\n    float peak = max(c.r, max(c.g, c.b));\n    if (peak < startCompression) return c;\n    const float d = 1.0 - startCompression;\n    float newPeak = 1.0 - d * d / (peak + d - startCompression);\n    c *= newPeak / peak;\n    float g = 1.0 - 1.0 / (desaturation * (peak - newPeak) + 1.0);\n    return mix(c, vec3(newPeak), g);\n}\n\n// ---- shader ----\nconst float ERROR_PX=1.5;\nconst float WIND=0.55;\n\nvec2 fir(vec2 p,float px,float errorPx,float seed){\n    float y=p.y;\n    p.x-=currentBend(y,0.105*WIND,iTime*0.62+seed);\n    float crown=max(abs(p.x)-0.32*(1.0-y),max(-y,y-1.0));\n    float trunk=max(abs(p.x)-0.029,abs(y+0.035)-0.10);\n    float detail=smoothstep(ERROR_PX,2.0*ERROR_PX,errorPx);\n    float d=crown;\n    if(detail>0.0 && y<1.04 && y>-0.04 && abs(p.x)<0.42){\n        float bough=1.0;\n        for(int k=0;k<6;k++){\n            float low=0.14*float(k);\n            float h=0.31-0.017*float(k);\n            float w=0.32*(1.0-low);\n            float u=(y-low)/h;\n            float skirt=low+0.07*(1.0-abs(p.x)/max(w,0.01));\n            bough=min(bough,max(abs(p.x)-w*(1.0-u),max(skirt-y,y-low-h)));\n        }\n        d=mix(crown,bough,detail);\n    }\n    return vec2(1.0-smoothstep(-px,px,min(d,trunk)),detail);\n}\nvoid mainImage(out vec4 fragColor,in vec2 fragCoord){\n    vec2 uv=(2.0*fragCoord-iResolution.xy)/iResolution.y;\n    vec3 sky=mix(vec3(1.15,0.47,0.22),vec3(0.14,0.28,0.50),smoothstep(-0.4,0.85,uv.y));\n    vec2 solar=uv-vec2(-0.58,0.22);\n    vec3 col=sky+vec3(1.2,0.72,0.3)*(exp(-4.5*length(solar))+1.0-smoothstep(0.125,0.131,length(solar)));\n    float px=2.0/iResolution.y;\n    for(int layer=0;layer<7;layer++){\n        float nearLevel=float(layer)/6.0;\n        float z=mix(55.0,2.8,pow(nearLevel,0.56));\n        float scale=1.5/z;\n        float x=uv.x/scale+float(layer)*16.31+iTime*0.065;\n        float id=floor(x/0.58);\n        float ground=-0.05-0.77*nearLevel+0.13*sin(uv.x*(2.0+nearLevel)+float(layer)*1.78)\n                    +0.055*gradientNoise(vec2(uv.x*4.0,float(layer)));\n        float forest=1.0-smoothstep(ground-px,ground+px,uv.y),refi  min(c.r, min(c.g, c.b));\n    float offset = x < 0.08 ? x - 6.25 * x * x : 0.04;\n    c -= offset;\n    float peak = max(c.r, max(c.g, c.b));\n    if (peak < startCompression) return c;\n    const float d = 1.0 - startCompression;\n    float newPeak = 1.0 - d * d / (peak + d - startCompression);\n    c *= newPeak / peak;\n    float g = 1.0 - 1.0 / (desaturation * (peak - newPeak) + 1.0);\n    return mix(c, vec3(newPeak), g);\n}\n\n// ---- shader ----\nconst float SCALE_DENSITY = 105.0;\nconst float LAYER_PERIOD_NM = 172.0;\nconst float WING_BEAT = 0.62;\n\n// Track minimum squared distance and even-odd crossings along a cubic outline.\nvoid wingArc(vec2 p, vec2 a, vec2 b, vec2 c, vec2 d, inout float dist2, inout float side) {\n    vec2 prev = a;\n    for (int i=1; i<=9; ++i) {\n        float t = float(i)/9.0;\n        vec2 q = mix(mix(mix(a,b,t),mix(b,c,t),t),mix(mix(b,c,t),mix(c,d,t),t),t);\n        vec2 edge = q-prev;\n        vec2 diff = p-prev;\n        vec2 delta = diff-edge*clamp(dot(diff,edge)/max(dot(edge,edge),1e-9),0.0,1.0);\n        dist2 = min(dist2,dot(delta,delta));\n        if ((q.y>p.y)!=(prev.y>p.y)) {\n            if (p.x < prev.x+edge.x*diff.y/edge.y) side = -side;\n        }\n        prev=q;\n    }\n}\n\nfloat wingOutline(vec2 p, bool fore) {\n    vec2 root = vec2(0.025,0.06);\n    float d=10.0, side=1.0;\n    if (fore) {\n        vec2 tip=vec2(1.30,0.67), corner=vec2(1.14,-0.08);\n        wingArc(p,root,vec2(0.28,0.40),vec2(0.95,0.82),tip,d,side);\n        wingArc(p,tip,vec2(1.42,0.56),vec2(1.33,0.12),corner,d,side);\n        wingArc(p,corner,vec2(0.84,-0.27),vec2(0.31,-0.17),root,d,side);\n    } else {\n        vec2 outer=vec2(1.02,-0.22), tail=vec2(0.47,-0.76);\n        wingArc(p,root,vec2(0.34,0.11),vec2(0.94,0.08),outer,d,side);\n        wingArc(p,outer,vec2(1.04,-0.46),vec2(0.81,-0.73),tail,d,side);\n        wingArc(p,tail,vec2(0.21,-0.78),vec2(0.065,-0.38),root,d,side);\n    }\n    return side*sqrt(d);\n}\n\nvec3 wingColor(vec2 p,float outline,bool fore,float tilt,float px) {\n    vec2 fromBase=p-vec2(0.015,0.07);\n    float r=length(fromBase);\n    float a=atan(fromBase.y,fromBase.x)+(fore?0.0:0.15);\n    float phase=(a+0.15*r+0.025*sin(6.0*r))* (fore?7.4:6.0);\n    float halfWidth=mix(0.008,0.002,smoothstep(0.0,1.1,r));\n    float veinDist=abs(fract(phase+0.5)-0.5)*max(r,0.02)/(fore?7.4:6.0);\n    float vein=1.0-smoothstep(halfWidth,halfWidth+px,veinDist);\n    // Secondary branches split from the radial veins near the leading edge.\n    float branch=abs(fract(phase+0.5+0.56*smoothstep(0.51,1.26,r))-0.5)*max(r,0.02)/7.4;\n    vein=max(vein,0.68*(1.0-smoothstep(0.002,0.002+px,branch))*smoothstep(0.55,0.82,r));\n    float margin=1.0-smoothstep(0.021,0.105,-outline+0.017*sin(a*38.0));\n    vec2 tile=vec2(r*0.85,a*max(r,0.06))*SCALE_DENSITY;\n    tile.x+=0.5*mod(floor(tile.y),2.0);\n    float seed=hash12(floor(tile));\n    float scales=(seed-0.5)*(1.0-smoothstep(0.25,1.0,px*SCALE_DENSITY));\n    float bend=tilt+0.30*sin(3.0*p.x+2.0*p.y)+0.095*sin(phase*TAU)+0.18*scales;\n    float nm=braggPeakNm(LAYER_PERIOD_NM,1.48,cos(bend));\n    float cyan=smoothstep(450.0,501.0,nm);\n    vec3 reflected=mix(vec3(0.018,0.08,0.83),vec3(0.012,0.72,0.87),cyan);\n    float flash=exp(-3.2*bend*bend)*(0.70+0.5*scales);\n    vec3 pigment=vec3(0.023,0.011,0.009)*(1.0+0.5*scales);\n    vec3 color=mix(pigment+reflected*(0.19+1.75*flash),pigment,margin);\n    float spots=exp(-130.0*abs(-outline-0.042))*pow(0.5+0.5*cos(phase*TAU),8.0);\n    color+=vec3(0.55,0.49,0.36)*spots*smoothstep(0.65,1.14,r);\n#if DEBUG_MODE == 3\n    return vec3(flash,margin,vein);\n#endif\n    return mix(color,pigment,vein*0.88);\n}\n\nvoid mainImage(out vec4 fragColor,in vec2 fragCoord) {\n    vec2 uv=(2.0*fragCoord-iResolution.xy)/iResolution.y;\n    float px=2.0/iResolution.y;\n    float blur=fbm(uv*2.3,3);\n    vec3 col=mix(vec3(0.008,0.029,0.024),vec3(0.13,0.22,0.105),smoothstep(-0.45,0.45,blur));\n    for(int i=0;i<18;i++){\n        vec3 h=hash32(vec2(float(i),17.0));\n        float d=length(uv-(h.xy-0.5)*vec2(4.0,2.5));\n        col+=vec3(0.12,0.14,0.065)*(1.0-smoothstep(0.035+0.09*h.z,0.13+0.09*h.z,d));\n    }\n    vec2 q=rot2(-0.13)*(uv+vec2(0.03,-0.04));\n    float beat=0.42+0.40*sin(WING_BEAT*iTime);\n    vec2 p=vec2(abs(q.x)/cos(0.51*beat),q.y);\n    float hind=wingOutline(p,false), fore=wingOutline(p,true);\n    if (hind<px) col=mix(col,wingColor(p,hind,false,beat+0.28,px),1.0-smoothstep(-px,px,hind));\n    if (fore<px) col=mix(col,wingColor(p,fore,true,beat+sign(q.x)*0.20,px),1.0-smoothstep(-px,px,fore));\n    float antenna=sdQuadraticBezier(vec2(abs(q.x),q.y),vec2(0.012,0.21),vec2(0.085,0.41),vec2(0.19,0.46));\n    float body=min(sdEllipse(q-vec2(0.0,-0.04),vec2(0.044,0.27)),length(q-vec2(0,0.20))-0.054);\n    col=mix(col,vec3(0.024,0.014,0.009)*(1.0+0.5*sin(q.y*150.0)),1.0-smoothstep(-px,px,min(antenna-0.004,body)));\n    fragColor=vec4(linearToSrgb(tonemapNeutral(col)),1.0);\n}\n","time":2.0,"modes":[0,3]},"noise-progression":{"image":"// Ten noise studies, matching the learning progression in references/noise-use-cases.md.\n// Top row, left to right: Perlin-style gradient, Voronoi borders, simplex, fBm, domain warp.\n// Bottom row: smooth value, Worley F1/F2, ridged, billow, hybrid terrain height.\n// Base noise and layered noise deliberately look different: a single octave is not a cloud texture.\n// @render time=2.0\n#define DEBUG_MODE 0 // 0 grayscale | 3 tile IDs | 5 unclipped scalar false color\n\n// Library code below is bundled from shader-skills (MIT): https://github.com/gokayfem/shader-skills\n// ---- shader-skills library: common ----\nconst float TAU = 6.28318530717959;\nfloat saturate(float x) { return clamp(x, 0.0, 1.0); }\nvec3 saturate(vec3 x) { return clamp(x, 0.0, 1.0); }\nfloat dot2(vec2 v) { return dot(v, v); }\nfloat dot2(vec3 v) { return dot(v, v); }\nmat2 rot2(float a) {\n    vec2 cs = normalize(vec2(cos(a), sin(a)));\n    return mat2(cs.x, cs.y, -cs.y, cs.x);\n}\n\n// ---- shader-skills library: hash ----\nuint pcgHash(uint v) {\n    uint state = v * 747796405u + 2891336453u;\n    uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;\n    return (word >> 22u) ^ word;\n}\nuvec3 pcg3d(uvec3 v) {\n    v = v * 1664525u + 1013904223u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    v ^= v >> 16u;\n    v.x += v.y * v.z;\n    v.y += v.z * v.x;\n    v.z += v.x * v.y;\n    return v;\n}\nfloat uintToUnit(uint h) { return float(h >> 8u) * (1.0 / 16777216.0); }\nvec2 uintToUnit(uvec2 h) { return vec2(h >> 8u) * (1.0 / 16777216.0); }\nvec3 uintToUnit(uvec3 h) { return vec3(h >> 8u) * (1.0 / 16777216.0); }\nvec4 uintToUnit(uvec4 h) { return vec4(h >> 8u) * (1.0 / 16777216.0); }\nfloat hash12(vec2 p) {\n    uvec2 q = uvec2(ivec2(floor(p)));\n    return uintToUnit(pcgHash(q.x + pcgHash(q.y)));\n}\nfloat hash13(vec3 p) {\n    uvec3 q = uvec3(ivec3(floor(p)));\n    return uintToUnit(pcgHash(q.x + pcgHash(q.y + pcgHash(q.z))));\n}\nvec2 hash22(vec2 p) {\n    ivec2 q = ivec2(floor(p));\n    return uintToUnit(pcg3d(uvec3(q.x, q.y, 0x2545u))).xy;\n}\nvec3 hash33(vec3 p) { return uintToUnit(pcg3d(uvec3(ivec3(floor(p))))); }\n\n// ---- shader-skills library: noise ----\nvec2 quinticFade(vec2 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec3 quinticFade(vec3 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }\nvec2 quinticFadeDeriv(vec2 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec3 quinticFadeDeriv(vec3 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }\nvec3 valueNoiseD(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    vec2 u = quinticFade(f), du = quinticFadeDeriv(f);\n    float a = hash12(i);\n    float b = hash12(i + vec2(1.0, 0.0));\n    float c = hash12(i + vec2(0.0, 1.0));\n    float d = hash12(i + vec2(1.0, 1.0));\n    float k1 = b - a, k2 = c - a, k3 = a - b - c + d;\n    return vec3(a + k1 * u.x + k2 * u.y + k3 * u.x * u.y,\n                du * vec2(k1 + k3 * u.y, k2 + k3 * u.x));\n}\nfloat valueNoise(vec2 p) { return valueNoiseD(p).x; }\nfloat valueNoise(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f);\n    return mix(mix(mix(hash13(i + vec3(0, 0, 0)), hash13(i + vec3(1, 0, 0)), u.x),\n                   mix(hash13(i + vec3(0, 1, 0)), hash13(i + vec3(1, 1, 0)), u.x), u.y),\n               mix(mix(hash13(i + vec3(0, 0, 1)), hash13(i + vec3(1, 0, 1)), u.x),\n                   mix(hash13(i + vec3(0, 1, 1)), hash13(i + vec3(1, 1, 1)), u.x), u.y), u.z);\n}\nvec2 latticeGradient(vec2 cell) {\n    float a = TAU * hash12(cell);\n    return vec2(cos(a), sin(a));\n}\nvec3 gradientNoiseD(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    vec2 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec2 ga = latticeGradient(i);\n    vec2 gb = latticeGradient(i + vec2(1.0, 0.0));\n    vec2 gc = latticeGradient(i + vec2(0.0, 1.0));\n    vec2 gd = latticeGradient(i + vec2(1.0, 1.0));\n    float va = dot(ga, f);\n    float vb = dot(gb, f - vec2(1.0, 0.0));\n    float vc = dot(gc, f - vec2(0.0, 1.0));\n    float vd = dot(gd, f - vec2(1.0, 1.0));\n    float k = va - vb - vc + vd;\n    float value = va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * k;\n    vec2 deriv = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.x * u.y * (ga - gb - gc + gd)\n               + du * (vec2(vb - va, vc - va) + u.yx * k);\n    return vec3(value, deriv);\n}\nfloat gradientNoise(vec2 p) { return gradientNoiseD(p).x; }\nvec3 simplexNoiseD(vec2 p, float rotation) {\n    const float SKEW = 0.36602540378;     // (sqrt(3) - 1) / 2: square lattice -> triangle lattice\n    const float UNSKEW = 0.21132486541;   // (3 - sqrt(3)) / 6\n    vec2 cell = floor(p + (p.x + p.y) * SKEW);\n    vec2 d0 = p - cell + (cell.x + cell.y) * UNSKEW;\n    vec2 o = (d0.x > d0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);   // which of the cell's two triangles holds p\n    vec2 corners[3] = vec2[3](cell, cell + o, cell + 1.0);\n    vec2 offsets[3] = vec2[3](d0, d0 - o + UNSKEW, d0 - 1.0 + 2.0 * UNSKEW);\n    mat2 spin = rot2(rotation);\n    vec3 sum = vec3(0.0);\n    for (int k = 0; k < 3; k++) {\n        vec2 d = offsets[k];\n        float t = max(0.5 - dot(d, d), 0.0);\n        vec2 g = spin * latticeGradient(corners[k]);\n        float gd = dot(g, d);\n        float t3 = t * t * t;\n        // value t^4 (g.d); gradient t^4 g - 8 t^3 (g.d) d\n        sum += vec3(t3 * t * gd, t3 * t * g - 8.0 * t3 * gd * d);\n    }\n    return 99.2 * sum;   // 1 / max over the simplex of sum t^4 |d|\n}\nvec3 simplexNoiseD(vec2 p) { return simplexNoiseD(p, 0.0); }\nfloat simplexNoise(vec2 p) { return simplexNoiseD(p, 0.0).x; }\nfloat latticeGradDot(vec3 cell, vec3 corner, vec3 f) {\n    vec3 g = hash33(cell + corner) * 2.0 - 1.0;\n    return dot(g, f - corner);\n}\nfloat gradientNoise(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f);\n    return mix(mix(mix(latticeGradDot(i, vec3(0, 0, 0), f), latticeGradDot(i, vec3(1, 0, 0), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 0), f), latticeGradDot(i, vec3(1, 1, 0), f), u.x), u.y),\n               mix(mix(latticeGradDot(i, vec3(0, 0, 1), f), latticeGradDot(i, vec3(1, 0, 1), f), u.x),\n                   mix(latticeGradDot(i, vec3(0, 1, 1), f), latticeGradDot(i, vec3(1, 1, 1), f), u.x), u.y), u.z);\n}\nvec4 gradientNoiseD(vec3 p) {\n    vec3 i = floor(p), f = fract(p);\n    vec3 u = quinticFade(f), du = quinticFadeDeriv(f);\n    vec3 g000 = hash33(i) * 2.0 - 1.0;\n    vec3 g100 = hash33(i + vec3(1, 0, 0)) * 2.0 - 1.0;\n    vec3 g010 = hash33(i + vec3(0, 1, 0)) * 2.0 - 1.0;\n    vec3 g110 = hash33(i + vec3(1, 1, 0)) * 2.0 - 1.0;\n    vec3 g001 = hash33(i + vec3(0, 0, 1)) * 2.0 - 1.0;\n    vec3 g101 = hash33(i + vec3(1, 0, 1)) * 2.0 - 1.0;\n    vec3 g011 = hash33(i + vec3(0, 1, 1)) * 2.0 - 1.0;\n    vec3 g111 = hash33(i + vec3(1, 1, 1)) * 2.0 - 1.0;\n    float v000 = dot(g000, f);\n    float v100 = dot(g100, f - vec3(1, 0, 0));\n    float v010 = dot(g010, f - vec3(0, 1, 0));\n    float v110 = dot(g110, f - vec3(1, 1, 0));\n    float v001 = dot(g001, f - vec3(0, 0, 1));\n    float v101 = dot(g101, f - vec3(1, 0, 1));\n    float v011 = dot(g011, f - vec3(0, 1, 1));\n    float v111 = dot(g111, f - vec3(1, 1, 1));\n    // value = v000 + kx u.x + ky u.y + kz u.z + kxy u.x u.y + kyz u.y u.z + kzx u.z u.x + kxyz u.x u.y u.z\n    float kx = v100 - v000, ky = v010 - v000, kz = v001 - v000;\n    float kxy = v000 - v100 - v010 + v110;\n    float kyz = v000 - v010 - v001 + v011;\n    float kzx = v000 - v100 - v001 + v101;\n    float kxyz = -v000 + v100 + v010 - v110 + v001 - v101 - v011 + v111;\n    float value = v000 + kx * u.x + ky * u.y + kz * u.z\n                + kxy * u.x * u.y + kyz * u.y * u.z + kzx * u.z * u.x + kxyz * u.x * u.y * u.z;\n    vec3 grad = g000 + (g100 - g000) * u.x + (g010 - g000) * u.y + (g001 - g000) * u.z\n              + (g000 - g100 - g010 + g110) * u.x * u.y\n              + (g000 - g010 - g001 + g011) * u.y * u.z\n              + (g000 - g100 - g001 + g101) * u.z * u.x\n              + (-g000 + g100 + g010 - g110 + g001 - g101 - g011 + g111) * u.x * u.y * u.z\n              + du * vec3(kx + kxy * u.y + kzx * u.z + kxyz * u.y * u.z,\n                          ky + kxy * u.x + kyz * u.z + kxyz * u.x * u.z,\n                          kz + kyz * u.y + kzx * u.x + kxyz * u.x * u.y);\n    return vec4(value, grad);\n}\nconst int FBM_MAX_OCTAVES = 12;\nfloat fbm(vec2 p, int octaves, float lacunarity, float persistence) {\n    const mat2 octaveRotation = mat2(0.8, 0.6, -0.6, 0.8);\n    float sum = 0.0, amp = 1.0, norm = 0.0;\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        sum += amp * gradientNoise(p);\n        norm += amp;\n        amp *= persistence;\n        p = lacunarity * (octaveRotation * p) + vec2(17.13, -3.71);\n    }\n    return 1.4 * sum / norm;\n}\nfloat fbm(vec2 p, int octaves) { return fbm(p, octaves, 2.01, 0.5); }\nfloat fbm(vec3 p, int octaves, float lacunarity, floa oat n = min(abs(gradientNoise(p)) * 1.4, 1.0);\n        n = n * (2.0 - n);\n        sum += amp * n * weight;\n        norm += amp;\n        weight = clamp(n * 1.5, 0.0, 1.0);\n        amp *= 0.5;\n        p = 2.01 * (octaveRotation * p) + vec3(17.13, -3.71, 5.29);\n    }\n    return sum / norm;\n}\nfloat warpedFbm(vec2 p, float strength, int octaves, out vec2 q, out vec2 r) {\n    q = vec2(fbm(p, octaves), fbm(p + vec2(3.1, 7.4), octaves));\n    r = vec2(fbm(p + strength * q + vec2(9.7, 2.6), octaves),\n             fbm(p + strength * q + vec2(6.3, 1.9), octaves));\n    return fbm(p + strength * r, octaves);\n}\nvec4 voronoi(vec2 p, float jitter) {\n    vec2 ip = floor(p), fp = fract(p);\n    float f1 = 8.0, f2 = 8.0;\n    vec2 nearest = vec2(0.0);\n    for (int j = -1; j <= 1; j++)\n    for (int i = -1; i <= 1; i++) {\n        vec2 g = vec2(float(i), float(j));\n        vec2 r = g + jitter * hash22(ip + g) - fp;\n        float d = dot(r, r);\n        if (d < f1) { f2 = f1; f1 = d; nearest = ip + g; }\n        else if (d < f2) { f2 = d; }\n    }\n    return vec4(sqrt(f1), sqrt(f2), nearest);\n}\nvec3 voronoiBorder(vec2 p, float jitter) {\n    vec2 ip = floor(p), fp = fract(p);\n    vec2 mg = vec2(0.0), mr = vec2(0.0);\n    float md = 8.0;\n    for (int j = -1; j <= 1; j++)\n    for (int i = -1; i <= 1; i++) {\n        vec2 g = vec2(float(i), float(j));\n        vec2 r = g + jitter * hash22(ip + g) - fp;\n        float d = dot(r, r);\n        if (d < md) { md = d; mr = r; mg = g; }\n    }\n    md = 8.0;\n    for (int j = -2; j <= 2; j++)\n    for (int i = -2; i <= 2; i++) {\n        vec2 g = mg + vec2(float(i), float(j));\n        vec2 r = g + jitter * hash22(ip + g) - fp;\n        if (dot2(mr - r) > 1e-5) {\n            md = min(md, dot(0.5 * (mr + r), normalize(r - mr)));\n        }\n    }\n    return vec3(md, mr);\n}\nfloat hybridTerrainHeight(vec2 p, int octaves) {\n    int count = clamp(octaves, 1, FBM_MAX_OCTAVES);\n    vec2 warp = vec2(fbm(p * 0.35, count), fb RO (min(iFrame, 0))\n\n// ---- shader-skills library: intersect ----\nvec2 iSphere(vec3 ro, vec3 rd, vec3 c, float r) {\n    vec3 oc = ro - c;\n    float b = dot(oc, rd);\n    vec3 qc = oc - b * rd;\n    float h = r * r - dot(qc, qc);\n    if (h < 0.0) return vec2(-1.0);\n    h = sqrt(h);\n    return vec2(-b - h, -b + h);\n}\n\n// ---- shader-skills library: camera ----\nmat3 cameraMatrix(vec3 ro, vec3 ta, float roll) {\n    vec3 w = normalize(ta - ro);\n    vec3 up = vec3(sin(roll), cos(roll), 0.0);\n    vec3 u = normalize(cross(w, up));\n    vec3 v = cross(u, w);\n    return mat3(u, v, w);\n}\nvec3 cameraRay(mat3 cam, vec2 uv, float focal) {\n    return normalize(cam * vec3(uv, focal));\n}\n\n// ---- shader-skills library: shading ----\nvec3 fresnelSchlick(float u, vec3 f0) {\n    float m = clamp(1.0 - u, 0.0, 1.0);\n    float m2 = m * m;\n    return f0 + (1.0 - f0) * (m2 * m2 * m);\n}\nfloat distributionGGX(float NoH, float alpha) {\n    float a2 = alpha * alpha;\n    float d = NoH * NoH * (a2 - 1.0) + 1.0;\n    return a2 / (PI * d * d);\n}\nfloat visibilitySmithGGX(float NoV, float NoL, float alpha) {\n    float a2 = alpha * alpha;\n    float gv = NoL * sqrt(NoV * NoV * (1.0 - a2) + a2);\n    float gl = NoV * sqrt(NoL * NoL * (1.0 - a2) + a2);\n    return 0.5 / max(gv + gl, 1e-6);\n}\nvec3 specularGGX(vec3 n, vec3 v, vec3 l, float roughness, vec3 f0) {\n    vec3 h = normalize(v + l);\n    float NoL = clamp(dot(n, l), 0.0, 1.0);\n    float NoV = max(dot(n, v), 1e-4);\n    float NoH = clamp(dot(n, h), 0.0, 1.0);\n    float VoH = clamp(dot(v, h), 0.0, 1.0);\n    float alpha = max(roughness, 0.045);\n    alpha *= alpha;\n    return PI * distributionGGX(NoH, alpha) * visibilitySmithGGX(NoV, NoL, alpha) * fresnelSchlick(VoH, f0) * NoL;\n}\n\n// ---- shader-skills library: color ----\nvec3 linearToSrgb(vec3 c) {\n    c = max(c, 0.0);\n    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));\n}\nfloat luminance(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }\n\n// ---- shader-skills library: tonemap ----\nvec3 tonemapAgXPunchy(vec3 c) {\n    const mat3 inset = mat3(0.842479062253094, 0.0423282422610123, 0.0423756549057051,\n                            0.0784335999999992, 0.878468636469772, 0.0784336,\n                            0.0792237451477643, 0.0791661274605434, 0.879142973793104);\n    const mat3 outset = mat3(1.19687900512017, -0.0528968517574562, -0.0529716355144438,\n                             -0.0980208811401368, 1.15190312990417, -0.0980434501171241,\n                             -0.0990297440797205, -0.0989611768448433, 1.15107367264116);\n    const float minEv = -12.47393, maxEv = 4.026069;\n    c = inset * max(c, 0.0);\n    c = clamp((log2(max(c, 1e-10)) - minEv) / (maxEv - minEv), 0.0, 1.0);\n    vec3 x2 = c * c, x4 = x2 * x2;\n    c = 15.5 * x4 * x2 - 40.14 * x4 * c + 31.96 * x4 - 6.868 * x2 * c + 0.4298 * x2 + 0.1191 * c - 0.00232;\n    c = pow(max(c, 0.0), vec3(1.35));\n    float luma = dot(c, vec3(0.2126, 0.7152, 0.0722));\n    c = luma + 1.4 * (c - luma);\n    c = outset * c;\n    return pow(max(c, 0.0), vec3(2.2));\n}\n\n// ---- shader-skills library: volume ----\nfloat phaseRayleigh(float mu) { return 3.0 / (16.0 * PI) * (1.0 + mu * mu); }\nfloat phaseCornetteShanks(float mu, float g) {\n    float g2 = g * g;\n    return 3.0 / (8.0 * PI) * (1.0 - g2) * (1.0 + mu * mu)\n         / ((2.0 + g2) * pow(max(1.0 + g2 - 2.0 * g * mu, 1e-6), 1.5));\n}\nvoid volumeStep(inout vec3 radiance, inout vec3 transmittance, vec3 sigmaT, vec3 inScatter, float ds) {\n    vec3 stepT = exp(-sigmaT * ds);\n    vec3 integral = (inScatter - inScatter * stepT) / max(sigmaT, vec3(1e-7));\n    radiance += transmittance * integral;\n    transmittance *= stepT;\n}\n\n// ---- shader-skills library: atmosphere ----\nvec3 sunDisk(vec3 rd, vec3 sunDir, float angularRadius, float pixelAngle) {\n    float ang = acos(clamp(dot(rd, sunDir), -1.0, 1.0));\n    float edge = 1.0 - smoothstep(angularRadius - pixelAngle, angularRadius + pixelAngle, ang);\n    float r = clamp(ang / angularRadius, 0.0, 1.0);\n    float muLimb = sqrt(max(1.0 - r * r, 0.0));\n    vec3 limb = pow(vec3(muLimb), vec3(0.397, 0.503, 0.652));\n    return edge * limb;\n}\nconst float ATMOSPHERE_GROUND_KM = 6360.0;\nconst float ATMOSPHERE_TOP_KM = 6460.0;\nvec3 atmosphereDensity(float h) {\n    return vec3(exp(-h / 8.0), exp(-h / 1.2), max(0.0, 1.0 - abs(h - 25.0) / 15.0));\n}\nvec3 atmosphereExtinction(vec3 density) {\n    const vec3 rayleigh = vec3(5.802, 13.558, 33.1) * 1e-3;\n    const float mie = (3.996 + 4.40) * 1e-3;\n    const vec3 ozone = vec3(0.650, 1.881, 0.085) * 1e-3;\n    return rayleigh * density.x + mie * density.y + ozone * density.z;\n}\nvec3 atmosphereSky(vec3 rd, vec3 sunDir, float viewHeightKm, float sunIntensity) {\n    const vec3 rayleighScatter = vec3(5.802, 13.558, 33.1) * 1e-3;\n    const float mieScatter = 3.996e-3;\n    vec3 ro = vec3(0.0, ATMOSPHERE_GROUND_KM + max(viewHeightKm, 0.001), 0.0);\n    vec2 top = iSphere(ro, rd, vec3(0.0), ATMOSPHERE_TOP_KM);\n    if (top.y <= 0.0) return vec3(0.0);\n    vec2 ground = iSphere(ro, rd, vec3(0.0), ATMOSPHERE_GROUND_KM);\n    float tStart = max(top.x, 0.0);\n    float tEnd = (ground.x > 0.0) ? ground.x : top.y;\n    float mu = dot(rd, sunDir);\n    float pR = phaseRayleigh(mu);\n    float pM = phaseCornetteShanks(mu, 0.8);\n    const int VIEW_STEPS = 16;\n    const int LIGHT_STEPS = 8;\n    float dt = (tEnd - tStart) / float(VIEW_STEPS);\n    vec3 radiance = vec3(0.0), transmittance = vec3(1.0);\n    for (int i = 0; i < VIEW_STEPS; i++) {\n        vec3 p = ro + rd * (tStart + (float(i) + 0.5) * dt);\n        vec3 dens = atmosphereDensity(length(p) - ATMOSPHERE_GROUND_KM);\n        vec3 sunT = vec3(0.0);\n        if (iSphere(p, sunDir, vec3(0.0), ATMOSPHERE_GROUND_KM).x < 0.0) {\n            float tl = iSphere(p, sunDir, vec3(0.0), ATMOSPHERE_TOP_KM).y;\n            float dl = tl / float(LIGHT_STEPS);\n            vec3 depth = vec3(0.0);\n            for (int j = 0; j < LIGHT_STEPS; j++) {\n                vec3 q = p + sunDir * ((float(j) + 0.5) * dl);\n                depth += atmosphereExtinction(atmosphereDensity(length(q) - ATMOSPHERE_GROUND_KM)) * dl;\n            }\n            sunT = exp(-depth);\n        }\n        vec3 scatter = sunT * (rayleighScatter * dens.x * pR + mieScatter * dens.y * pM) * sunIntensity;\n        volumeStep(radiance, transmittance, atmosphereExtinction(dens), scatter, dt);\n    }\n    return radiance;\n}\n\n// ---- shader-skills library: post ----\nvec3 ditherTPDF(vec2 fragCoord, int frame) {\n    vec2 r = hash22(vec2(floor(fragCoord) + 7919.0 * float(frame % 1024)));\n    return vec3((r.x + r.y - 1.0) / 255.0);\n}\n\n// ---- shader-skills library: debug ----\nvec3 debugNormal(vec3 n) { return 0.5 + 0.5 * n; }\nvec3 debugHeat(float t) {\n    t = clamp(t, 0.0, 1.0);\n    return clamp(vec3(1.5 * t, 1.6 * t * t * t - 0.1, 0.9 * sin(PI * t) + 0.2 * t * t), 0.0, 1.0);\n}\n\n// ---- shader ----\n// ---- art controls ----\nconst vec3  SUN_DIR = normalize(vec3(0.2, 0.14, -1.0));    // low sun ahead of the camera, a little to the right\nconst float SUN_INTENSITY = 20.0;\nconst float WIND_ANGLE = 1.9;          // direction the waves travel, radians from +X toward +Z (camera looks down -Z)\nconst float SWELL_LENGTH = 34.0;       // longest wavelength, meters\nconst float SWELL_HEIGHT = 0.8;        // amplitude of the longest wave, meters\nconst float CHOP = 0.7;                // amplitude ratio between successive waves: higher = choppier\nconst float CREST_SHARPNESS = 2.4;     // 1 rolling swell .. 3 peaky crests\nconst float RIPPLE = 0.008;            // capillary ripple amplitude, meters\nconst float FOAM_AMOUNT = 1.0;\nconst vec3  WATER_DEEP = vec3(0.004, 0.02, 0.04);      // linear albedo of the deep body\nconst vec3  WATER_GLOW = vec3(0.05, 0.26, 0.25);       // color of sunlight scattered through thin crests\nconst float HAZE = 6.0;                // aerial perspective strength (multiplies sea-level air extinction)\nconst float CAMERA_HEIGHT = 3.0;       // meters above mean sea level\nconst float EXPOSURE = 0.9;\nconst float FOCAL = 2.0;\n\nconst float GRAVITY = 9.81;\nconst float WAVELENGTH_RATIO = 0.8;    // wavelength ratio between successive waves\nconst int   TRACE_WAVES = 12;          // waves in the traced surface\nconst int   SHADE_WAVES = 28;          // waves in the shading normal (adds fine chop)\nconst int   FOAM_WAVES = 6;            // waves whose crests make foam\nconst float TRACE_FAR = 400.0;         // beyond this, intersect the mean plane and rely on filtering\n\n// Wave i of the sum: unit direction, wavenumber, amplitude and phase. Wavelengths fall geometrically from the swell;\n// long waves run with the wind, short chop spreads wider around it.\nvoid wave(int i, out vec2 dir, out float k, out float amp, out float phase) {\n    float fi = float(i);\n    vec3 h = hash32(vec2(fi, 17.0));\n    float a = WIND_ANGLE + mix(0.35, 1.3, min(fi / 12.0, 1.0)) * (2.0 * h.x - 1.0);\n    dir = vec2(cos(a), sin(a));\n    k = TAU / (SWELL_LENGTH * pow(WAVELENGTH_RATIO, fi) * mix(0.85, 1.15, h.y));\n    amp = SWELL_HEIGHT * pow(CHOP, fi);\n    phase = TAU * h.z;\n}\n\n// Deep-water dispersion: a wave of wavenumber k moves at angular frequency sqrt(g k), so long swell outruns chop.\nfloat wavePhase(vec2 dir, float k, float phase, vec2 xz) {\n    return k * dot(dir, xz) - sqrt(GRAVITY * k) * iTime + phase;\n}\n\n// How much of a wave survives filtering: 1 while its wavelength spans 6+ pixel footprints, 0 below 2.\n// A pixel covers an ellipse on the water: fp.zw = its size across and along the view, fp.xy = the unit view\n// direction projected on the water. At grazing angles it is far longer along the view, which is where waves alias.\nfloat waveKeep(vec2 dir, float k, vec4 fp) {\n    float footprint = length(vec2(dot(dir, vec2(-fp.y, fp.x)) * fp.z, dot(dir, fp.xy) * fp.w));\n    return smoothstep(2.0, 6.0, TAU / (k * footprint));\n}\n\n// Exp-sine profile: sharp crests, broad troughs. exp(s (sin - 1)) - 0.3 keeps the mean level near 0.\n// Waves too small for the footprint are faded out, so distant geometry does not alias into streaks.\nfloat oceanHeight(vec2 xz, int count, vec4 fp) {\n    float h = 0.0;\n    for (int i = ZERO; i < SHADE_WAVES; i++) {\n        if (i >= count) break;\n        vec2 dir; float k, amp, phase;\n        wave(i, dir, k, amp, phase);\n        h += waveKeep(dir, k, fp) * amp * (exp(CREST_SHARPNESS * (sin(wavePhase(dir, k, phase, xz)) - 1.0)) - 0.3);\n    }\n    return h;\n}\n\n// Steepest slope one wave of amplitude a and wavenumber k can reach: a k max|s cos(t) e^(s (sin(t) - 1))|.\nfloat profileMaxSlope() {\n    float s = CREST_SHARPNESS;\n    float sn = (sqrt(1.0 + 4.0 * s * s) - 1.0) / (2.0 * s);\n    return s * sqrt(1.0 - sn * sn) * exp(s * (sn - 1.0));\n}\n\n// Bounds of the traced surface: vec3(lowest height, highest height, steepest slope).\nvec3 oceanBounds() {\n    float ampSum = 0.0, slopeSum = 0.0;\n    for (int i = ZERO; i < TRACE_WAVES; i++) {\n        vec2 dir; float k, amp, phase;\n        wave(i, dir, k, amp, phase);\n        ampSum += amp;\n        slopeSum += amp * k;\n    }\n    return vec3(-0.3 * ampSum, 0.7 * ampSum, slopeSum * profileMaxSlope());\n}\n\n// Ray vs the traced wave surface. The surface lies inside the slab bounds.x <= y <= bounds.y, so clip the ray to it,\n// then step by the height gap over the fastest rate the gap can close (the ray's descent plus the steepest slope times\n// its horizontal speed). The slope bound is relaxed by 0.6 for speed; a secant step refines the crossing.\n// Returns vec2(t, steps); t < 0 when the ray reaches TRACE_FAR first.\nvec2 traceOcean(vec3 ro, vec3 rd, vec3 bounds, vec4 pixelSpread) {\n    if (rd.y >= 0.0) return vec2(-1.0, 0.0);\n    float t = max((ro.y - bounds.y) / -rd.y, 0.0);\n    float tEnd = min((ro.y - bounds.x) / -rd.y, TRACE_FAR);\n    float closing = -rd.y + 0.6 * bounds.z * length(rd.xz);\n    float tPrev = t, gapPrev = 1e10;\n    for (int i = ZERO; i < 200; i++) {\n        vec3 p = ro + rd * t;\n        float gap = p.y - oceanHeight(p.xz, TRACE_WAVES, pixelSpread * vec4(1.0, 1.0, t, t));\n        if (gap < 0.0) return vec2(mix(tPrev, t, gapPrev / (gapPrev - gap)), float(i));\n        if (t >= tEnd) break;\n        tPrev = t;\n        gapPrev = gap;\n        t = min(t + max(gap / closing, 0.004 * t), tEnd);\n    }\n    return vec2(-1.0, 200.0);\n}\n\n// Shading detail at xz: height, slope and Laplacian of all SHADE_WAVES, each wave faded out as its wavelength nears\n// the pixel footprint. Returns vec4(height, dh/dx, dh/dz, laplacian). lostSlope2 collects the slope variance of the\n// faded waves (it becomes roughness); crest is the convexity of the big waves, 1 where all their crests meet (foam).\nvec4 oceanDetail(vec2 xz, vec4 fp, out float lostSlope2, out float crest) {\n    const float slopeRms = 0.3 + 0.06 * CREST_SHARPNESS;   // RMS of the profile's slope per unit a k\n    vec4 s = vec4(0.0);\n    lostSlope2 = 0.0;\n    crest = 0.0;\n    float crestMax = 0.0;\n    for (int i = ZERO; i < SHADE_WAVES; i++) {\n        vec2 dir; float k, amp, phase;\n        wave(i, dir, k, amp, phase);\n        float keep = waveKeep(dir, k, fp);\n        float theta = wavePhase(dir, k, phase, xz);\n        float sn = sin(theta), cs = cos(theta);\n        float e = exp(CREST_SHARPNESS * (sn - 1.0));\n        float d1 = CREST_SHARPNESS * cs * e;                                      // dW/dtheta\n        float d2 = CREST_SHARPNESS * (CREST_SHARPNESS * cs * cs - sn) * e;        // d2W/dtheta2\n        s += keep * amp * vec4(e - 0.3, k * d1 * dir, k * k * d2);\n        lostSlope2 += (1.0 - keep) * (amp * k * slopeRms) * (amp * k * slopeRms);\n        if (i < FOAM_WAVES) {\n            crest -= keep * amp * k * k * d2;\n            crestMax += amp * k * k * CREST_SHARPNESS;   // a crest's curvature: -W'' = s at the top\n        }\n    }\n    crest /= crestMax;\n    return s;\n}\n\n// Transmittance from a point at heightKm toward dir, through the atmosphere (colors the sunlight).\nvec3 sunTransmittance(float heightKm, vec3 dir) {\n    vec3 ro = vec3(0.0, ATMOSPHERE_GROUND_KM + heightKm, 0.0);\n    if (iSphere(ro, dir, vec3(0.0), ATMOSPHERE_GROUND_KM).x > 0.0) return vec3(0.0);\n    float tl = iSphere(ro, dir, vec3(0.0), ATMOSPHERE_TOP_KM).y;\n    vec3 depth = vec3(0.0);\n    for (int i = 0; i < 12; i++) {\n        vec3 q = ro + dir * ((float(i) + 0.5) * tl / 12.0);\n        depth += atmosphereExtinction(atmosphereDensity(length(q) - ATMOSPHERE_GROUND_KM)) * tl / 12.0;\n    }\n    return exp(-depth);\n}\n\nvec3 render(vec2 fragCoord) {\n    vec2 uv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;\n    float pixelAngle = 2.0 / (iResolution.y * FOCAL);\n    float viewKm = CAMERA_HEIGHT * 0.001;\n\n#if DEBUG_MODE == 1\n    return vec3(0.5 + 0.5 * oceanHeight(uv * 30.0, SHADE_WAVES, vec4(1.0, 0.0, 1e-4, 1e-4)) / SWELL_HEIGHT);\n#endif\n\n    vec3 ro = vec3(0.0, CAMERA_HEIGHT, 0.0);\n    mat3 cam = cameraMatrix(ro, ro + vec3(0.0, -0.06, -1.0), 0.0);\n    vec3 rd = cameraRay(cam, uv, FOCAL);\n\n    vec3 sunColor = SUN_INTENSITY * 0.12 * sunTransmittance(viewKm, SUN_DIR);\n    if (rd.y >= 0.0) {\n        vec3 sky = atmosphereSky(rd, SUN_DIR, viewKm, SUN_INTENSITY);\n        return sky + sunColor * 40.0 * sunDisk(rd, SUN_DIR, 0.012, pixelAngle);\n    }\n\n    // pixel footprint on the water per meter of distance: pixelAngle across the view, stretched by 1/sin(grazing\n    // angle) along it\n    vec4 pixelSpread = vec4(normalize(rd.xz), pixelAngle, pixelAngle / max(-rd.y, 0.01));\n    vec3 bounds = oceanBounds();\n    vec2 hit = traceOcean(ro, rd, bounds, pixelSpread);\n#if DEBUG_MODE == 4\n    return debugHeat(hit.y / 200.0);\n#endif\n    // past TRACE_FAR the waves are below pixel size anyway: use the mean plane and let filtering do the rest\n    float t = (hit.x > 0.0) ? hit.x : ro.y / -rd.y;\n    vec3 p = ro + rd * t;\n\ eflection into the water would hit the next wave: fold it back to the sky\n    vec3 skyRefl = atmosphereSky(refl, SUN_DIR, viewKm, SUN_INTENSITY);\n    vec3 skyAmbient = atmosphereSky(vec3(0.0, 1.0, 0.0), SUN_DIR, viewKm, SUN_INTENSITY);\n\n    // sun glint: GGX whose roughness absorbs the slope variance of the waves filtered away at this distance\n    float alpha = sqrt(0.02 * 0.02 + 2.0 * lostSlope2);\n    vec3 glint = specularGGX(n, v, SUN_DIR, sqrt(alpha), vec3(0.02)) * sunColor;\n    vec3 reflection = F * skyRefl;\n\n    // body: refracted light scattered back out, plus sunlight glowing through thin crests seen against the sun\n    float backlit = pow(clamp(dot(rd, SUN_DIR), 0.0, 1.0), 4.0);\n    float thin = smoothstep(0.45, 0.9, (wv.x - bounds.x) / (bounds.y - bounds.x));   // crest tops only\n    vec3 body = (1.0 - F) * (WATER_DEEP * (skyAmbient + sunColor * max(dot(n, SUN_DIR), 0.0))\n                             + WATER_GLOW * sunColor * backlit * thin);\n\n    // foam is a thin white scatterer: diffuse sun and sky light, plus sunlight shining through it from behind\n    vec3 foamColor = vec3(0.9) * (sunColor * (max(dot(n, SUN_DIR), 0.0) + 0.5 * backlit) + 3.0 * skyAmbient);\n\n#if DEBUG_MODE == 2\n    return debugNormal(n);\n#elif DEBUG_MODE == 3\n    return vec3(foam, clamp(crest, 0.0, 1.0), lace);\n#elif DEBUG_MODE == 5\n    return sqrt(F);\n#elif DEBUG_MODE == 6\n    return vec3(luminance(reflection), luminance(glint) * 0.1, luminance(body) * 10.0);\n#endif\n\n    vec3 col = mix(reflection + glint + body, foamColor, foam);\n    // aerial perspective, with the haze color taken from the sky just above the horizon so the two meet without a seam\n    vec3 fogColor = atmosphereSky(normalize(vec3(rd.x, 0.0, rd.z)), SUN_DIR, viewKm, SUN_INTENSITY);\n    vec3 airT = exp(-t * 0.001 * HAZE * atmosphereExtinction(atmosphereDensity(0.0)));\n    return col * airT + fogColor * (1.0 - airT);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n    vec3 col zx * u.x + kxyz * u.x * u.y);\n    return vec4(value, grad);\n}\nconst int FBM_MAX_OCTAVES = 12;\nfloat fbm(vec2 p, int octaves, float lacunarity, float persistence) {\n    const mat2 octaveRotation = mat2(0.8, 0.6, -0.6, 0.8);\n    float sum = 0.0, amp = 1.0, norm = 0.0;\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        sum += amp * gradientNoise(p);\n        norm += amp;\n        amp *= persistence;\n        p = lacunarity * (octaveRotation * p) + vec2(17.13, -3.71);\n    }\n    return 1.4 * sum / norm;\n}\nfloat fbm(vec2 p, int octaves) { return fbm(p, octaves, 2.01, 0.5); }\nfloat fbm(vec3 p, int octaves, float lacunarity, float persistence) {\n    const mat3 octaveRotation = mat3(0.00, 0.80, 0.60,\n                                     -0.80, 0.36, -0.48,\n                                     -0.60, -0.48, 0.64);\n    float sum = 0.0, amp = 1.0, norm = 0.0;\n    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {\n        if (i >= octaves) break;\n        sum += amp * gradientNoise(p);\n        norm += amp;\n        amp *= persistence;\n        p = lacunarity * (octaveRotation * p) + vec3(17.13, -3.71, 5.29);\n    }\n    return sum / norm;\n}\n\n// ---- shader-skills library: pattern ----\nfloat filteredStripes(float x, float w) {\n    w = max(w, 1e-4);\n    float a = x + 0.5 * w, b = x - 0.5 * w;\n    float ia = floor(a) * 0.5 + max(fract(a) - 0.5, 0.0);\n    float ib = floor(b) * 0.5 + max(fract(b) - 0.5, 0.0);\n    return (ia - ib) / w;\n}\n\n// ---- shader-skills library: sdf3d ----\nfloat sdQuadraticBezier(vec3 pos, vec3 A, vec3 B, vec3 C) {\n    vec3 a = B - A;\n    vec3 b = A - 2.0 * B + C;\n    vec3 c = a * 2.0;\n    vec3 d = A - pos;\n    float bb = dot(b, b);\n    if (bb < 1e-10) {\n        vec3 pa = pos - A, ca = C - A;\n        return length(pa - ca * clamp(dot(pa, ca) / dot(ca, ca), 0.0, 1.0));\n    }\n    float kk = 1.0 / bb;\n    float kx = kk * dot(a, b);\n    float ky = kk * (2.0 * dot(a, a) + dot(d, b)) / 3.0;\ ge(vec2 uv, float base, float amp, float freq, float seed) {\n    float h = base + amp * fbm(vec2(uv.x * freq + seed, seed), 5);\n    return (uv.y - h) / sqrt(1.0 + 4.0 * amp * amp * freq * freq);   // divide by an approximate slope bound\n}\n\n// A palm-like plant: a curved trunk plus a fan of vesica leaves around its crown.\nfloat plant(vec2 p) {\n    float trunk = sdQuadraticBezier(p, vec2(0.0, -1.0), vec2(0.12, -0.45), vec2(0.02, 0.0)) - 0.025;\n    vec2 q = p - vec2(0.02, 0.0);\n    q = domPolar(q, 9.0);                 // 9 leaves, each pointing along +X in its sector\n    q.y += 0.06 * q.x * q.x;              // droop\n    float leaf = sdVesica((q - vec2(0.24, 0.0)).yx, 0.32, 0.27);\n    return min(trunk, leaf);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n    vec2 uv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;\n    float px = 2.0 / iResolution.y;\n\n    // sky: perceptual gradient\n    vec3 col = mixOklab(srgbToLinear(SKY_HORIZON), srgbToLinear(SKY_TOP), smoothstep(-0.3, 1.0, uv.y));\n\n    // stars: one random star per grid cell, fading toward the horizon\n    vec2 cell = floor(uv * 18.0);\n    vec3 rnd = hash32(cell);\n    float star = sdCircle(uv * 18.0 - cell - 0.2 - 0.6 * rnd.xy, 0.02 + 0.05 * rnd.z * rnd.z) / 18.0;\n    float twinkle = 0.6 + 0.4 * sin(iTime * (1.0 + 3.0 * rnd.z) + 6.0 * rnd.x);\n    col += vec3(1.0, 0.95, 0.9) * fillAA(star, px) * smoothstep(0.1, 0.8, uv.y) * twinkle;\n\n    // sun with retro gaps that thicken toward its bottom edge\n    vec2 sp = uv - vec2(0.42, 0.18);\n    float sun = sdCircle(sp, 0.36);\n    float gaps = filteredStripes(sp.y * 14.0 + 0.5, px * 14.0);\n    float gapMask = mix(1.0, gaps, (1.0 - smoothstep(-0.3, 0.0, sp.y)));\n    col = mix(col, srgbToLinear(SUN) * 1.6, fillAA(sun, px) * gapMask);\n    col += srgbToLinear(SUN) * 0.25 * exp(-6.0 * max(sun, 0.0));   // glow\n\n    // ridges, back to front\n    col = mix(col, srgbToLinear(RIDGE_FAR), fillAA(ridge(uv, -0.1, 0.18, 1.2, 3.0), px)) rn -0.50+0.09*sin(p.x*2.0)+0.07*sin(1.8*p.y+p.x); }\nvec2 shelfField(vec3 p){\n    vec2 best=vec2((p.y-seabed(p.xz))*0.9,0.0);\n    const float spacing=1.55;\n    vec2 id=floor(p.xz/spacing);\n    vec3 h=hash32(id);\n    vec2 root=(id+0.42+0.16*h.xy)*spacing;\n    float y=p.y-seabed(root);\n    float height=0.43+1.18*h.z, t=clamp(y/height,0.0,1.0);\n    vec2 q=p.xz-root-vec2(0.13,-0.055)*t*t;\n    float angle=atan(q.y,q.x+1e-7);\n    float radius=(0.16+0.15*h.y)*(0.62+0.42*t)+0.088*sin(PI*t);\n    radius+=0.018*sin(7.0*angle+2.2*t)*smoothstep(0.08,0.24,length(q));\n    float rim=height+0.048*sin(3.0*angle+4.0*h.x)+0.023*sin(7.0*angle);\n    float radial=length(q);\n    float outer=max(radial-radius,max(-y,y-rim));\n    float inner=max(radial-(radius-0.043),0.12-y);\n    float d=0.56*max(outer,-inner);\n    if(d<best.x) best=vec2(d,1.0+h.x);\n    // Every barrel fits at least 0.07 units inside its tile. A positive guard also lets rays cross tile seams.\n    vec2 edge=0.5*spacing-abs(mod(p.xz,spacing)-0.5*spacing);\n    best.x=min(best.x,min(edge.x,edge.y)+0.07);\n    return best;\n}\nvoid mainImage(out vec4 fragColor,in vec2 fragCoord) {\n    vec2 uv=(2.0*fragCoord-iResolution.xy)/iResolution.y;\n    vec3 ro=vec3(1.12,1.10,3.23+0.12*sin(0.32*iTime));\n    vec3 rd=cameraRay(cameraMatrix(ro,vec3(0.65,0.42,0.0),0.04),uv,1.65);\n    vec3 water=mix(vec3(0.012,0.022,0.065),vec3(0.034,0.17,0.19),smoothstep(-0.38,0.5,rd.y));\n    vec3 col=water,n=vec3(0.0);\n    float t=0.03;\n    for(int i=0;i<85;i++){\n        vec3 p=ro+t*rd;\n        vec2 hit=shelfField(p);\n        if(hit.x<0.0015+0.0003*t){\n            vec2 e=vec2(0.002,0.0);\n            n=normalize(vec3(shelfField(p+e.xyy).x-shelfField(p-e.xyy).x,\n                             shelfField(p+e.yxy).x-shelfField(p-e.yxy).x,\n                             shelfField(p+e.yyx).x-shelfField(p-e.yyx).x));\n            vec3 light=normalize(vec3(-0.55,0.75,0.32));\n            float grain=0.5+0.5*gradientNoise(p*14.0);\n
